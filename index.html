<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>跑团log分拣整理系统</title>
  <script>
    if (/Mobi|Android|iPhone/i.test(navigator.userAgent)) { window.location.href = "mobile.html"; }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    .window-drag-over { background-color: rgba(99, 102, 241, 0.03) !important; border-color: rgba(99, 102, 241, 0.8) !important; border-style: dashed !important; }
    .drop-indicator { height: 8px; margin-top: -4px; margin-bottom: -4px; transition: all 0.15s ease-out; position: relative; z-index: 10; background-color: transparent; }
    .drop-indicator.active { height: 50px; margin-top: 4px; margin-bottom: 4px; background-color: rgba(99, 102, 241, 0.05); border: 2px dashed rgba(99, 102, 241, 0.4); border-radius: 6px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen overflow-hidden flex flex-col">

  <!-- 顶部导航栏 -->
  <header class="flex items-center justify-between px-4 py-2 bg-white border-b border-slate-200 shrink-0 shadow-sm z-20">
    <div class="flex items-center space-x-2">
      <div class="p-1.5 bg-indigo-50 rounded-lg text-indigo-600 border border-indigo-100">
        <i data-lucide="layers" class="h-4 w-4"></i>
      </div>
      <div>
        <h1 class="text-sm md:text-base font-bold text-slate-900">跑团log分拣系统</h1>
        <p class="hidden md:block text-[10px] text-slate-400">滑动窗口极速渲染 · 支持多工作表进度续传 · 队列自由拖拽 · v2.2.5</p>
      </div>
    </div>

    <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar">
      <div class="hidden lg:flex items-center space-x-1 text-xs text-slate-500 bg-slate-100 px-2 py-1 rounded border border-slate-200">
        <i data-lucide="keyboard" class="h-3.5 w-3.5 text-indigo-500"></i>
        <span>按 <b>0-9</b> 分拣首行，按 <b>Enter</b> 确认预判，按 <b>.</b> 撤回</span>
      </div>
      <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" multiple class="hidden" />
      <div id="actionButtons" class="flex items-center space-x-1.5 shrink-0">
        <button id="uploadBtn" class="flex items-center space-x-1 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-medium shadow-sm">
          <i data-lucide="upload" class="h-3.5 w-3.5"></i>
          <span>上传表格 / 进度文件</span>
        </button>
        <button id="mockBtn" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs font-medium border border-slate-200">测试数据</button>
      </div>
      <div id="activeControls" class="hidden flex items-center space-x-1.5 shrink-0">
        <button id="saveProgressBtn" class="flex items-center space-x-1 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-medium shadow-sm">
          <i data-lucide="save" class="h-3.5 w-3.5"></i>
          <span>保存进度 (Excel)</span>
        </button>
        <button id="undoBtn" disabled class="flex items-center space-x-1 px-2.5 py-1.5 bg-white text-slate-400 rounded-lg text-xs font-medium border border-slate-200 disabled:opacity-50">
          <i data-lucide="undo-2" class="h-3.5 w-3.5"></i>
          <span>撤回 (.)</span>
        </button>
        <button id="appendBtn" class="flex items-center space-x-1 px-2.5 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-lg text-xs font-medium border border-indigo-200">
          追加
        </button>
        <button id="resetBtn" class="flex items-center space-x-1 px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs font-medium border border-slate-200">
          重置
        </button>
      </div>
    </div>
  </header>

  <!-- 主体工作区 -->
  <main class="flex-1 flex flex-col lg:flex-row overflow-hidden p-3 gap-3">
    <!-- 【左侧栏】：待处理队列 -->
    <section class="flex-[5.5] flex flex-col bg-white border border-slate-200 rounded-xl p-3 shadow-sm overflow-hidden">
      <div class="flex items-center justify-between mb-2 shrink-0">
        <div class="flex items-center space-x-2">
          <span class="flex h-2 w-2 rounded-full bg-slate-400"></span>
          <h2 class="text-xs font-bold text-slate-700 uppercase tracking-wider">待处理队列 (共 <span id="queueCount">0</span> 行)</h2>
          <span id="lockTip" class="hidden text-[10px] bg-amber-50 text-orange-600 border border-amber-200 px-1.5 py-0.2 rounded font-bold animate-pulse">🔒 锁定模式：点击卡片空白直接归位</span>
        </div>
        <div class="flex items-center space-x-1.5">
          <button id="exportQueueBtn" class="hidden flex items-center space-x-1 px-2 py-0.5 text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-600 rounded border border-slate-200">
            <i data-lucide="download" class="h-3 w-3"></i><span>仅导出未分拣</span>
          </button>
          <div id="headerInfo" class="hidden text-[9px] text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200 max-w-[150px] truncate">
            <span id="headerInfoText" class="truncate">已合并原始列</span>
          </div>
        </div>
      </div>
      <div id="queueList" class="flex-1 flex flex-col justify-start space-y-2 bg-slate-50/50 p-2 rounded-xl border border-slate-200/60 overflow-y-auto">
        <div class="h-full flex flex-col items-center justify-center text-slate-400 p-4 text-center">
          <i data-lucide="upload" class="h-8 w-8 mb-2 text-indigo-500/60 animate-bounce"></i>
          <p class="text-xs font-medium text-slate-600">请在右上角上传表格</p>
        </div>
      </div>
    </section>

    <!-- 【右侧栏】：分窗接收区 & 改名面板 -->
    <section class="flex-[4.5] flex flex-col gap-3 overflow-hidden">
      <div class="flex-1 min-h-[220px] flex flex-col bg-white border border-slate-200 rounded-xl p-3 shadow-sm overflow-hidden">
        <div class="flex items-center justify-between mb-2 shrink-0">
          <div class="flex items-center space-x-1.5">
            <span class="flex h-2 w-2 rounded-full bg-indigo-500"></span>
            <h2 class="text-xs font-bold text-slate-700 uppercase tracking-wider">分流接收窗口</h2>
          </div>
          <div class="flex items-center space-x-2">
            <button id="toggleRenameBtn" class="hidden flex items-center space-x-1 px-2 py-0.5 text-[10px] bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded border border-indigo-200 font-bold">
              <i data-lucide="user-cog" class="h-3 w-3"></i><span>整理发送者</span>
            </button>
            <button id="addWindowBtn" class="flex items-center space-x-1 px-2 py-0.5 text-[10px] bg-slate-50 hover:bg-slate-100 text-indigo-600 rounded border border-slate-200 font-medium">
              <i data-lucide="plus" class="h-3 w-3"></i><span>增加分窗</span>
            </button>
          </div>
        </div>
        <div id="windowsContainer" class="flex-1 flex gap-2.5 overflow-x-auto pb-1 pr-1"></div>
      </div>

      <div id="renamePanel" class="hidden shrink-0 bg-indigo-50/40 border border-indigo-100 rounded-xl p-2.5 max-h-[180px] overflow-y-auto shadow-inner">
        <div class="text-[10px] font-bold text-indigo-800 mb-1.5 flex items-center justify-between">
          <span>👤 发送者初始整理（支持一键改名，或点击红色垃圾桶删除该QQ全部记录）</span>
        </div>
        <div id="renameList" class="space-y-1.5"></div>
      </div>
    </section>
  </main>

  <script>
    const PRESET_COLORS = [
      { border: 'border-pink-200', bg: 'bg-pink-50/60', text: 'text-pink-600', btn: 'bg-pink-500 hover:bg-pink-600 text-white' }, 
      { border: 'border-blue-200', bg: 'bg-blue-50/60', text: 'text-blue-600', btn: 'bg-blue-500 hover:bg-blue-600 text-white' },
      { border: 'border-emerald-200', bg: 'bg-emerald-50/60', text: 'text-emerald-600', btn: 'bg-emerald-500 hover:bg-emerald-600 text-white' },
      { border: 'border-purple-200', bg: 'bg-purple-50/60', text: 'text-purple-600', btn: 'bg-purple-500 hover:bg-purple-600 text-white' },
      { border: 'border-orange-200', bg: 'bg-orange-50/60', text: 'text-orange-600', btn: 'bg-orange-500 hover:bg-orange-600 text-white' }
    ];
    const GROUP_BG_COLORS = ['bg-rose-50/70 border-rose-200/60', 'bg-sky-50/70 border-sky-200/60', 'bg-emerald-50/70 border-emerald-200/60', 'bg-amber-50/70 border-amber-200/60', 'bg-violet-50/70 border-violet-200/60'];
    const MOCK_COMPLEX_DATA = [
      { id: 'mock-1', 时间: '2026-10-04T02:01:10.000Z', 发送者: '张三-HO1', 发送者QQ号: '10001', 消息内容: '哈喽哈喽，大家早上好呀！', _来源: '群聊A' },
      { id: 'mock-2', 时间: '2026-10-04T02:02:15.000Z', 发送者: '李四-HO2', 发送者QQ号: '10002', 消息内容: '早！今天晚上有人开团吗？求带！', _来源: '群聊A' },
      { id: 'mock-3', 时间: '2026-10-04T02:03:00.000Z', 发送者: '张小三', 发送者QQ号: '10001', 消息内容: '滴滴，有人在吗？帮我看看这个卡怎么建。', _来源: '群聊B' },
      { id: 'mock-4', 时间: '2026-10-04T02:04:22.000Z', 发送者: '旁观者NPC', 发送者QQ号: '99999', 消息内容: '【系统提示：请遵守群规】', _来源: '群聊B' },
      { id: 'mock-5', 时间: '2026-10-04T02:05:40.000Z', 发送者: '李大四', 发送者QQ号: '10002', 消息内容: '新人报道，请多多指教~', _来源: '群聊C' }
    ];

    let windows = [
      { id: 'win-0', name: '水聊', color: PRESET_COLORS[0], items: [] },
      { id: 'win-1', name: 'HO1', color: PRESET_COLORS[1], items: [] },
      { id: 'win-2', name: 'HO2', color: PRESET_COLORS[2], items: [] },
      { id: 'win-3', name: 'HO3', color: PRESET_COLORS[3], items: [] }
    ];
    let queue = [];
    let isLoaded = false;
    let originalHeaders = new Set();
    let isRenamePanelOpen = false;
    let lockedWindowId = null;
    let qqToWindowMapping = {};
    let actionHistory = [];
    let draggedItemId = null;
    let draggedSourceWindowId = null;
    let lastDroppedItemId = null;
    let groupColorMapping = {};
    let scrollInterval = null;

    function extractGroupName(filename) {
      if (!filename) return '未知来源';
      const nameWithoutExt = filename.substring(0, filename.lastIndexOf('.')) || filename;
      return nameWithoutExt.length > 8 ? nameWithoutExt.substring(0, 8) + '...' : nameWithoutExt;
    }

    function extractFields(row) {
      return {
        displayTime: row['时间'] || '',
        displaySender: row['发送者'] || '未知发送者',
        displayContent: row['消息内容'] || '（无消息内容）',
        rawTimeValue: row['时间'] ? new Date(row['时间']).getTime() : 0
      };
    }

    function getRowQQ(row) {
      return row['发送者QQ号'] || row['发送者QQ'] || row['QQ'] || row['发送者id'] || row['发送者ID'] || '无QQ号';
    }

    function formatOnlyTime(isoString) {
      if (!isoString) return '';
      return isoString.includes('T') ? isoString.split('T')[1].split('.')[0] : String(isoString);
    }

    function getRecommendedWindow() {
      if (queue.length === 0) return null;
      const qq = getRowQQ(queue[0]);
      const recommendedWinId = qqToWindowMapping[qq];
      return recommendedWinId ? windows.find(w => w.id === recommendedWinId) || null : null;
    }

    function getGroupColorClass(sourceName) {
      if (!groupColorMapping[sourceName]) {
        const assignedIndex = Object.keys(groupColorMapping).length % GROUP_BG_COLORS.length;
        groupColorMapping[sourceName] = GROUP_BG_COLORS[assignedIndex];
      }
      return groupColorMapping[sourceName];
    }

    function renderAll() {
      renderWindows();
      renderQueue();
      renderRenameList();
      updateUndoButtonState();
      lucide.createIcons();
    }

    function renderWindows() {
      const container = document.getElementById('windowsContainer');
      container.innerHTML = '';

      windows.forEach((win, index) => {
        const winEl = document.createElement('div');
        winEl.id = `window-box-${win.id}`;
        const isLocked = lockedWindowId === win.id;
        winEl.className = `flex flex-col w-48 md:w-56 shrink-0 rounded-xl border-2 transition-all duration-200 ${isLocked ? 'border-indigo-600 bg-indigo-50/40 shadow-lg ring-2 ring-indigo-100' : `${win.color.border} ${win.color.bg} shadow-sm`}`;
        
        winEl.addEventListener('dragover', (e) => { e.preventDefault(); winEl.classList.add('window-drag-over'); handleDragOverScroll(e, win.id); });
        winEl.addEventListener('dragleave', () => { winEl.classList.remove('window-drag-over'); stopDragScroll(); });
        winEl.addEventListener('drop', (e) => { e.preventDefault(); winEl.classList.remove('window-drag-over'); stopDragScroll(); handleCardDrop(win.id, null); });

        let itemsHtml = '';
        if (win.items.length === 0) {
          itemsHtml = `<div class="h-full flex flex-col items-center justify-center text-slate-400 py-10"><i data-lucide="file-spreadsheet" class="h-5 w-5 mb-1 opacity-40"></i><span class="text-[10px]">等待分拣</span></div>`;
        } else {
          const winItemsArr = [];
          win.items.forEach((item, itemIdx) => {
            const info = extractFields(item);
            const sourceLabel = item._来源 || '未知';
            const isJustDropped = item.id === lastDroppedItemId;
            winItemsArr.push(`
              <div class="drop-indicator" ondragover="handleIndicatorDragOver(event, this)" ondragleave="handleIndicatorDragLeave(this)" ondrop="handleIndicatorDrop(event, '${win.id}', ${itemIdx}, this)"></div>
              <div id="card-${item.id}" draggable="true" ondragstart="handleCardDragStart(event, '${item.id}', '${win.id}')" ondragend="handleCardDragEnd(event)" class="p-2 bg-white rounded-lg border border-slate-200/80 hover:border-slate-300 hover:shadow-md transition-all duration-200 cursor-grab active:cursor-grabbing ${isJustDropped ? 'just-dropped' : ''}">
                <div class="flex justify-between text-[9px] text-slate-400 mb-0.5"><span class="font-bold text-slate-600 truncate max-w-[70px]">${info.displaySender}</span><span class="font-mono">${formatOnlyTime(info.displayTime)}</span></div>
                <div class="font-semibold text-[11px] text-slate-700 truncate mb-1">${info.displayContent}</div>
                <div class="text-[8px] text-indigo-500 bg-indigo-50/50 px-1 py-0.2 rounded border border-indigo-100/50 inline-block truncate max-w-full">${sourceLabel}</div>
              </div>
            `);
          });
          winItemsArr.push(`<div class="drop-indicator" ondragover="handleIndicatorDragOver(event, this)" ondragleave="handleIndicatorDragLeave(this)" ondrop="handleIndicatorDrop(event, '${win.id}', ${win.items.length}, this)"></div>`);
          itemsHtml = winItemsArr.join('');
        }

        winEl.innerHTML = `
          <div class="px-2.5 py-1.5 flex items-center justify-between border-b border-slate-200/60 bg-white/80 shrink-0">
            <div class="flex items-center space-x-1">
              <input type="checkbox" ${isLocked ? 'checked' : ''} onchange="toggleLockWindow('${win.id}', this.checked)" class="h-3.5 w-3.5 text-indigo-600 border-slate-300 rounded cursor-pointer" />
              <span class="flex items-center justify-center w-3.5 h-3.5 rounded bg-slate-200 text-slate-600 text-[9px] font-bold">${index}</span>
              <input type="text" value="${win.name}" onchange="renameWindow('${win.id}', this.value)" class="bg-transparent font-bold text-xs text-slate-800 focus:outline-none rounded px-0.5 py-0.5 w-20 border border-transparent hover:border-slate-200" />
            </div>
            <div class="flex items-center space-x-0.5">
              <button onclick="exportWindow('${win.id}')" class="p-1 hover:bg-slate-100 rounded text-slate-500 hover:text-emerald-600"><i data-lucide="download" class="h-3 w-3"></i></button>
              <button onclick="removeWindow('${win.id}')" class="p-1 hover:bg-slate-100 rounded text-slate-500 hover:text-rose-600"><i data-lucide="trash-2" class="h-3 w-3"></i></button>
            </div>
          </div>
          <div id="window-scroll-${win.id}" class="flex-1 p-2 overflow-y-auto space-y-0.5">${itemsHtml}</div>
          <div class="px-2.5 py-1 bg-white/80 text-[10px] text-slate-500 flex justify-between border-t border-slate-200/60 shrink-0">
            <span>${isLocked ? '🔒 已锁定' : '已收集'}</span><span class="font-bold ${win.color.text}">${win.items.length} 行</span>
          </div>
        `;
        container.appendChild(winEl);
      });
      if (lastDroppedItemId) {
        const targetCard = document.getElementById(`card-${lastDroppedItemId}`);
        if (targetCard) targetCard.scrollIntoView({ behavior: 'auto', block: 'center' });
        lastDroppedItemId = null;
      }
    }

    function handleDragOverScroll(e, windowId) {
      const scrollEl = document.getElementById(`window-scroll-${windowId}`);
      if (!scrollEl) return;
      const rect = scrollEl.getBoundingClientRect();
      const relativeY = e.clientY - rect.top;
      const containerHeight = rect.height;
      stopDragScroll();
      if (relativeY < 40 && scrollEl.scrollTop > 0) {
        scrollInterval = setInterval(() => { scrollEl.scrollTop -= 5; }, 15);
      } else if (relativeY > containerHeight - 40 && scrollEl.scrollTop + containerHeight < scrollEl.scrollHeight) {
        scrollInterval = setInterval(() => { scrollEl.scrollTop += 5; }, 15);
      }
    }

    function stopDragScroll() { if (scrollInterval) { clearInterval(scrollInterval); scrollInterval = null; } }

    window.handleCardDragStart = function(e, itemId, sourceWinId) {
      draggedItemId = itemId; draggedSourceWindowId = sourceWinId;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', itemId);
      setTimeout(() => { const el = document.getElementById(sourceWinId === 'queue' ? `queue-card-${itemId}` : `card-${itemId}`); if (el) el.classList.add('opacity-30'); }, 0);
    };
    window.handleCardDragEnd = function(e) { e.target.classList.remove('opacity-30'); stopDragScroll(); };
    window.handleIndicatorDragOver = function(e, indicator) { e.preventDefault(); e.stopPropagation(); indicator.classList.add('active'); };
    window.handleIndicatorDragLeave = function(indicator) { indicator.classList.remove('active'); };
    window.handleIndicatorDrop = function(e, targetWinId, targetIdx, indicator) { e.preventDefault(); e.stopPropagation(); indicator.classList.remove('active'); handleCardDrop(targetWinId, targetIdx); };

    function handleCardDrop(targetWinId, targetIdx) {
      if (!draggedItemId || !draggedSourceWindowId) return;

      // 待处理队列内部自由拖拽排序
      if (draggedSourceWindowId === 'queue' && targetWinId === 'queue') {
        const fromIdx = queue.findIndex(item => item.id === draggedItemId);
        if (fromIdx === -1) return;
        const [draggedItem] = queue.splice(fromIdx, 1);
        let adjustedIdx = targetIdx;
        if (targetIdx > fromIdx) adjustedIdx = targetIdx - 1;
        queue.splice(adjustedIdx, 0, draggedItem);
        pushAction({ type: 'queue_reorder', itemId: draggedItemId, fromIdx: fromIdx, toIdx: adjustedIdx });
        draggedItemId = null; draggedSourceWindowId = null;
        renderAll();
        return;
      }

      // 从窗口拖回待处理队列
      if (draggedSourceWindowId !== 'queue' && targetWinId === 'queue') {
        const sourceWin = windows.find(w => w.id === draggedSourceWindowId);
        if (!sourceWin) return;
        const fromIdx = sourceWin.items.findIndex(item => item.id === draggedItemId);
        if (fromIdx === -1) return;
        const [draggedItem] = sourceWin.items.splice(fromIdx, 1);
        queue.splice(targetIdx, 0, draggedItem);
        pushAction({ type: 'drag_back_to_queue', sourceWinId: draggedSourceWindowId, itemId: draggedItemId, originalIdx: fromIdx, targetIdx: targetIdx });
        draggedItemId = null; draggedSourceWindowId = null;
        renderAll();
        return;
      }

      // 跨窗拖拽或从队列拖入窗口
      const sourceWin = windows.find(w => w.id === draggedSourceWindowId);
      const targetWin = windows.find(w => w.id === targetWinId);
      if (draggedSourceWindowId === 'queue') {
        const fromIdx = queue.findIndex(item => item.id === draggedItemId);
        if (fromIdx === -1 || !targetWin) return;
        const [draggedItem] = queue.splice(fromIdx, 1);
        if (targetIdx === null) targetWin.items.push(draggedItem);
        else targetWin.items.splice(targetIdx, 0, draggedItem);
        pushAction({ type: 'click_sort', windowId: targetWinId, item: draggedItem, originalIdx: fromIdx });
        qqToWindowMapping[getRowQQ(draggedItem)] = targetWinId;
      } else if (sourceWin && targetWin) {
        const fromIdx = sourceWin.items.findIndex(item => item.id === draggedItemId);
        if (fromIdx === -1) return;
        const [draggedItem] = sourceWin.items.splice(fromIdx, 1);
        if (targetIdx === null) targetWin.items.push(draggedItem);
        else {
          let adjustedIdx = targetIdx;
          if (draggedSourceWindowId === targetWinId && targetIdx > fromIdx) adjustedIdx = targetIdx - 1;
          targetWin.items.splice(adjustedIdx, 0, draggedItem);
        }
        pushAction({ type: 'drag', sourceWinId: draggedSourceWindowId, targetWinId: targetWinId, itemId: draggedItemId, originalIdx: fromIdx, targetIdx: targetIdx === null ? targetWin.items.length : targetIdx });
        qqToWindowMapping[getRowQQ(draggedItem)] = targetWinId;
      }
      lastDroppedItemId = draggedItemId; draggedItemId = null; draggedSourceWindowId = null;
      renderAll();
    }

    // 【滑动渲染窗口】：仅渲染队列前 50 条，彻底消除 PC 端长列表重绘卡顿
    function renderQueue() {
      document.getElementById('queueCount').innerText = queue.length;
      const listContainer = document.getElementById('queueList');
      if (!isLoaded) {
        listContainer.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-400 p-4 text-center"><i data-lucide="upload" class="h-8 w-8 mb-2 text-indigo-500/60 animate-bounce"></i><p class="text-xs font-medium text-slate-600">请在右上角上传表格</p></div>`;
        document.getElementById('headerInfo').classList.add('hidden');
        document.getElementById('toggleRenameBtn').classList.add('hidden');
        document.getElementById('exportQueueBtn').classList.add('hidden');
        return;
      }
      document.getElementById('toggleRenameBtn').classList.remove('hidden');
      document.getElementById('exportQueueBtn').classList.remove('hidden');
      if (queue.length === 0) {
        listContainer.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-500 p-4 text-center"><i data-lucide="check-circle-2" class="h-8 w-8 mb-2 text-emerald-500"></i><p class="text-xs text-emerald-600 font-bold">所有数据分拣完毕！</p></div>`;
        return;
      }

      const recommendedWin = getRecommendedWindow();
      const queueHtmlArr = [];
      
      // 关键性能优化：只截取前 50 条进行渲染
      const visibleQueue = queue.slice(0, 50);

      visibleQueue.forEach((item, i) => {
        const isFirst = i === 0;
        const info = extractFields(item);
        const sourceLabel = item._来源 || '未知';
        const groupColorClass = getGroupColorClass(sourceLabel);
        const hoverClass = lockedWindowId ? 'hover:bg-indigo-50/40 hover:border-indigo-300 cursor-pointer active:scale-[0.995]' : 'cursor-grab active:cursor-grabbing';

        let rowButtonsHtml = '';
        windows.forEach((win) => {
          const isRec = isFirst && recommendedWin && recommendedWin.id === win.id;
          rowButtonsHtml += `
            <button onclick="sortItemDirectly(event, ${i}, '${win.id}')" class="px-3 py-1.5 text-xs font-black rounded-lg border transition-all active:scale-90 ${isRec ? 'bg-indigo-600 border-indigo-700 text-white animate-pulse ring-2 ring-indigo-300' : 'bg-white hover:bg-slate-100 border-slate-200 text-slate-700'}">
              ${win.name}
            </button>
          `;
        });

        if (!lockedWindowId) {
          queueHtmlArr.push(`<div class="drop-indicator" ondragover="handleIndicatorDragOver(event, this)" ondragleave="handleIndicatorDragLeave(this)" ondrop="handleIndicatorDrop(event, 'queue', ${i}, this)"></div>`);
        }

        queueHtmlArr.push(`
          <div id="queue-card-${item.id}" draggable="${!lockedWindowId}" ondragstart="handleCardDragStart(event, '${item.id}', 'queue')" ondragend="handleCardDragEnd(event)" onclick="if(event.target.tagName !== 'BUTTON' && !event.target.closest('button') && event.target.tagName !== 'INPUT') handleQueueRowClick(${i})" class="flex-none flex flex-col p-3 rounded-xl border border-slate-200/60 shadow-sm gap-2 ${hoverClass} ${groupColorClass} opacity-95 hover:opacity-100">
            <div class="flex items-center justify-between w-full">
              <div class="flex items-center space-x-2 min-w-0">
                <span class="w-5 h-5 rounded-full flex items-center justify-center text-[11px] font-black shrink-0 bg-slate-200 text-slate-600">${i + 1}</span>
                <span class="text-[10px] font-bold text-indigo-700 bg-white/90 px-1.5 py-0.5 rounded border border-indigo-100 shrink-0">${sourceLabel}</span>
                <span class="text-xs font-black text-slate-800 truncate max-w-[120px] md:max-w-[180px]">${info.displaySender}</span>
              </div>
              <div class="flex items-center space-x-1 shrink-0">${rowButtonsHtml}</div>
            </div>
            <div class="w-full pl-7 flex justify-between items-end gap-4">
              <p class="text-sm text-slate-900 font-bold leading-relaxed break-all select-text flex-1">${info.displayContent}</p>
              <button onclick="deleteSingleQueueItem(event, ${i})" class="p-1.5 bg-white/80 hover:bg-rose-50 text-slate-400 hover:text-rose-600 rounded-lg border border-slate-200 hover:border-rose-200 shrink-0 shadow-sm"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
            </div>
          </div>
        `);
      });

      if (!lockedWindowId) {
        queueHtmlArr.push(`<div class="drop-indicator" ondragover="handleIndicatorDragOver(event, this)" ondragleave="handleIndicatorDragLeave(this)" ondrop="handleIndicatorDrop(event, 'queue', ${visibleQueue.length}, this)"></div>`);
      }

      // 如果还有剩余未渲染的行，在底部显示一个轻量级提示
      if (queue.length > 50) {
        queueHtmlArr.push(`
          <div class="py-3 text-center text-xs text-slate-400 font-medium bg-slate-100/50 rounded-xl border border-dashed border-slate-200">
            💡 仅展示前 50 条发言，剩余 <span class="font-bold text-indigo-600">${queue.length - 50}</span> 条已自动隐藏（分流后自动补充补位）
          </div>
        `);
      }

      listContainer.innerHTML = queueHtmlArr.join('');
    }

    window.sortItemDirectly = function(e, itemIndex, windowId) {
      e.stopPropagation();
      if (itemIndex < queue.length) {
        const item = queue.splice(itemIndex, 1)[0];
        const win = windows.find(w => w.id === windowId);
        if (win) {
          win.items.push(item);
          pushAction({ type: 'click_sort', windowId: windowId, item: item, originalIdx: itemIndex });
          qqToWindowMapping[getRowQQ(item)] = windowId;
        }
        renderAll();
        scrollWindowToBottom(windowId);
      }
    };

    window.deleteSingleQueueItem = function(e, index) {
      e.stopPropagation();
      if (index < queue.length) {
        const [deletedItem] = queue.splice(index, 1);
        pushAction({ type: 'delete_single', item: deletedItem, originalIdx: index });
        renderAll();
      }
    };

    window.handleQueueRowClick = function(itemIndex) {
      if (!lockedWindowId) return;
      if (itemIndex < queue.length) {
        const item = queue.splice(itemIndex, 1)[0];
        const win = windows.find(w => w.id === lockedWindowId);
        if (win) {
          win.items.push(item);
          pushAction({ type: 'click_sort', windowId: lockedWindowId, item: item, originalIdx: itemIndex });
          qqToWindowMapping[getRowQQ(item)] = lockedWindowId;
        }
        renderAll();
        scrollWindowToBottom(lockedWindowId);
      }
    };

    function renderRenameList() {
      const panel = document.getElementById('renamePanel');
      const list = document.getElementById('renameList');
      list.innerHTML = '';
      if (!isLoaded) { panel.classList.add('hidden'); return; }

      const qqToNames = {};
      const allItems = [...queue];
      windows.forEach(w => allItems.push(...w.items));
      allItems.forEach(item => {
        const qq = getRowQQ(item);
        if (!qqToNames[qq]) qqToNames[qq] = new Set();
        qqToNames[qq].add(item['发送者'] || '未知发送者');
      });

      const qqList = Object.keys(qqToNames);
      if (qqList.length === 0) { list.innerHTML = `<div class="text-[10px] text-slate-400">无QQ号字段</div>`; return; }

      qqList.forEach(qq => {
        const namesStr = Array.from(qqToNames[qq]).join(' / ');
        const row = document.createElement('div');
        row.id = `rename-row-${qq}`;
        row.className = "flex items-center justify-between bg-white p-1.5 rounded-lg border border-indigo-100/60 shadow-sm gap-2";
        row.innerHTML = `
          <div class="flex-1 min-w-0"><div class="flex items-center space-x-1"><span class="text-[9px] font-mono text-indigo-600 bg-indigo-50 px-1 rounded">QQ: ${qq}</span><span class="text-[10px] font-bold text-slate-700 truncate">${namesStr}</span></div></div>
          <div class="flex items-center space-x-1 shrink-0">
            <input type="text" placeholder="新名字" id="rename-input-${qq}" onfocus="highlightRenameRow('${qq}', true)" onblur="highlightRenameRow('${qq}', false)" class="w-16 md:w-28 text-[10px] px-1.5 py-0.5 border border-slate-200 rounded" />
            <button onclick="applyGlobalRename('${qq}')" class="px-1.5 py-0.5 bg-indigo-600 text-white rounded text-[9px] font-bold">改名</button>
            <button onclick="deleteQQRecords('${qq}', '${namesStr}')" class="p-1 bg-rose-50 text-rose-600 rounded border border-rose-200"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
          </div>
        `;
        list.appendChild(row);
      });
    }

    window.highlightRenameRow = function(qq, isFocused) {
      const row = document.getElementById(`rename-row-${qq}`);
      if (row) { if (isFocused) { row.classList.add('bg-indigo-50/80', 'border-indigo-400'); } else { row.classList.remove('bg-indigo-50/80', 'border-indigo-400'); } }
    };

    window.applyGlobalRename = function(qq) {
      const input = document.getElementById(`rename-input-${qq}`);
      if (!input) return;
      const newName = input.value.trim();
      if (!newName) return alert('请输入新名字');
      const oldNamesMap = [];
      const recordOldName = (item) => { if (String(getRowQQ(item)) === String(qq)) { oldNamesMap.push({ id: item.id, oldName: item['发送者'] }); item['发送者'] = newName; } };
      queue.forEach(recordOldName);
      windows.forEach(win => win.items.forEach(recordOldName));
      pushAction({ type: 'rename', qq: qq, oldNamesMap: oldNamesMap });
      renderAll();
    };

    window.deleteQQRecords = function(qq, namesStr) {
      if (!confirm(`确定要删除 QQ [${qq}] 的所有记录吗？`)) return;
      const deletedQueueItems = queue.filter(item => String(getRowQQ(item)) === String(qq));
      const deletedWinItems = [];
      queue = queue.filter(item => String(getRowQQ(item)) !== String(qq));
      windows.forEach(win => {
        const winDeleted = win.items.filter(item => String(getRowQQ(item)) === String(qq));
        if (winDeleted.length > 0) deletedWinItems.push({ winId: win.id, items: winDeleted });
        win.items = win.items.filter(item => String(getRowQQ(item)) !== String(qq));
      });
      pushAction({ type: 'delete_qq', qq: qq, deletedQueueItems: deletedQueueItems, deletedWinItems: deletedWinItems });
      renderAll();
    };

    document.getElementById('toggleRenameBtn').onclick = () => {
      isRenamePanelOpen = !isRenamePanelOpen;
      const panel = document.getElementById('renamePanel');
      isRenamePanelOpen ? panel.classList.remove('hidden') : panel.classList.add('hidden');
    };

    function sortItem(windowId) {
      if (queue.length === 0) return;
      const item = queue.shift();
      const win = windows.find(w => w.id === windowId);
      if (win) { win.items.push(item); qqToWindowMapping[getRowQQ(item)] = windowId; pushAction({ type: 'sort', windowId: windowId, item: item }); }
      renderAll();
      scrollWindowToBottom(windowId);
    }

    function scrollWindowToBottom(windowId) {
      requestAnimationFrame(() => {
        const el = document.getElementById(`window-scroll-${windowId}`);
        if (el) { el.scrollTop = el.scrollHeight; }
      });
    }

    function pushAction(action) { actionHistory.push(action); updateUndoButtonState(); }
    function updateUndoButtonState() {
      const btn = document.getElementById('undoBtn');
      if (btn) {
        btn.disabled = actionHistory.length === 0;
        btn.className = btn.disabled ? "flex items-center space-x-1 px-2.5 py-1.5 bg-white text-slate-400 rounded-lg text-xs border border-slate-200" : "flex items-center space-x-1 px-2.5 py-1.5 bg-white text-indigo-600 rounded-lg text-xs border border-indigo-200 hover:bg-indigo-50";
      }
    }

    window.triggerUndo = function() {
      if (actionHistory.length === 0) return;
      const act = actionHistory.pop();
      if (act.type === 'sort') {
        const win = windows.find(w => w.id === act.windowId);
        if (win && win.items.length > 0) queue.unshift(win.items.pop());
      } else if (act.type === 'click_sort') {
        const win = windows.find(w => w.id === act.windowId);
        if (win && win.items.length > 0) queue.splice(act.originalIdx, 0, win.items.pop());
      } else if (act.type === 'delete_single') {
        queue.splice(act.originalIdx, 0, act.item);
      } else if (act.type === 'queue_reorder') {
        const [item] = queue.splice(act.toIdx, 1);
        queue.splice(act.fromIdx, 0, item);
      } else if (act.type === 'drag_back_to_queue') {
        const win = windows.find(w => w.id === act.sourceWinId);
        if (win) { const [item] = queue.splice(act.targetIdx, 1); win.items.splice(act.originalIdx, 0, item); }
      } else if (act.type === 'drag') {
        const sWin = windows.find(w => w.id === act.sourceWinId);
        const tWin = windows.find(w => w.id === act.targetWinId);
        if (sWin && tWin) {
          const idx = tWin.items.findIndex(item => item.id === act.itemId);
          if (idx !== -1) { const [item] = tWin.items.splice(idx, 1); sWin.items.splice(act.originalIdx, 0, item); }
        }
      } else if (act.type === 'rename') {
        const restore = (item) => { const match = act.oldNamesMap.find(r => r.id === item.id); if (match) item['发送者'] = match.oldName; };
        queue.forEach(restore); windows.forEach(w => w.items.forEach(restore));
      } else if (act.type === 'delete_qq') {
        queue = [...queue, ...act.deletedQueueItems].sort((a, b) => extractFields(a).rawTimeValue - extractFields(b).rawTimeValue);
        act.deletedWinItems.forEach(rec => { const win = windows.find(w => w.id === rec.winId); if (win) win.items = [...win.items, ...rec.items].sort((a, b) => extractFields(a).rawTimeValue - extractFields(b).rawTimeValue); });
      }
      renderAll();
    };

    document.getElementById('undoBtn').onclick = () => triggerUndo();
    window.toggleLockWindow = function(winId, checked) {
      if (checked) {
        lockedWindowId = winId;
        document.getElementById('lockTip').classList.remove('hidden');
      } else {
        if (lockedWindowId === winId) {
          lockedWindowId = null;
          document.getElementById('lockTip').classList.add('hidden');
        }
      }
      renderAll();
    };

    function renameWindow(id, newName) { const win = windows.find(w => w.id === id); if (win) win.name = newName; renderAll(); }
    function removeWindow(id) {
      const win = windows.find(w => w.id === id);
      if (win && win.items.length > 0) { queue = [...queue, ...win.items].sort((a, b) => extractFields(a).rawTimeValue - extractFields(b).rawTimeValue); }
      windows = windows.filter(w => w.id !== id);
      renderAll();
    }

    document.getElementById('addWindowBtn').onclick = () => {
      if (windows.length >= 10) return alert('最多支持 10 个分窗');
      windows.push({ id: `win-${windows.length}`, name: `新分窗 ${windows.length}`, color: PRESET_COLORS[windows.length % PRESET_COLORS.length], items: [] });
      renderAll();
    };

    window.exportWindow = function(windowId) {
      const win = windows.find(w => w.id === windowId);
      if (!win || win.items.length === 0) return alert('该分窗暂无数据');
      const headers = Array.from(originalHeaders);
      const csvContent = [headers, ...win.items.map(item => headers.map(h => { const val = String(item[h] !== undefined ? item[h] : ''); return val.includes(',') ? `"${val}"` : val; }))].map(e => e.join(",")).join("\n");
      const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob); link.download = `${win.name}_分拣导出.csv`;
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    };

    document.getElementById('exportQueueBtn').onclick = () => {
      if (queue.length === 0) return alert('待处理队列为空');
      const headers = Array.from(originalHeaders);
      const csvContent = [headers, ...queue.map(item => headers.map(h => { const val = String(item[h] !== undefined ? item[h] : ''); return val.includes(',') ? `"${val}"` : val; }))].map(e => e.join(",")).join("\n");
      const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob); link.download = `待处理队列_未分拣.csv`;
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    };

    document.getElementById('saveProgressBtn').onclick = () => {
      if (!isLoaded) return alert('暂无数据可保存');
      try {
        const wb = XLSX.utils.book_new();
        const headers = Array.from(originalHeaders);
        const formatData = (items) => [headers, ...items.map(item => headers.map(h => item[h] !== undefined ? item[h] : ''))];
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(formatData(queue)), "待处理队列");
        windows.forEach(win => {
          const safeSheetName = win.name.replace(/[\\\?\*\/\[\]]/g, '').substring(0, 30) || `分窗_${win.id}`;
          XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(formatData(win.items)), safeSheetName);
        });
        XLSX.writeFile(wb, `跑团进度_${new Date().toISOString().split('T')[0]}.xlsx`);
      } catch (err) { alert(`保存进度失败: ${err.message}`); }
    };

    function readFileAsync(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try { resolve({ workbook: XLSX.read(new Uint8Array(e.target.result), { type: 'array' }), filename: file.name }); } catch (err) { reject(err); }
        };
        reader.onerror = (err) => reject(err);
        reader.readAsArrayBuffer(file);
      });
    }

    async function processFiles(files) {
      if (files.length === 0) return;
      try {
        const results = await Promise.all(Array.from(files).map(file => readFileAsync(file)));
        if (results.length === 1 && results[0].workbook.SheetNames.includes("待处理队列")) {
          const wb = results[0].workbook;
          queue = XLSX.utils.sheet_to_json(wb.Sheets["待处理队列"], { defval: "" });
          queue.forEach((row, idx) => { row.id = `row-imported-q-${idx}-${Date.now()}`; Object.keys(row).forEach(h => { if (h !== 'id' && h !== '_来源') originalHeaders.add(h); }); });
          windows = []; let winIdx = 0;
          wb.SheetNames.forEach(sheetName => {
            if (sheetName !== "待处理队列") {
              const items = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: "" });
              items.forEach((row, idx) => { row.id = `row-imported-w-${winIdx}-${idx}-${Date.now()}`; });
              windows.push({ id: `win-${winIdx}`, name: sheetName, color: PRESET_COLORS[winIdx % PRESET_COLORS.length], items: items });
              winIdx++;
            }
          });
          isLoaded = true;
          document.getElementById('actionButtons').classList.add('hidden');
          document.getElementById('activeControls').classList.remove('hidden');
          document.getElementById('headerInfo').classList.remove('hidden');
          document.getElementById('headerInfoText').innerText = `已恢复进度！队列剩余: ${queue.length} 行`;
          renderAll(); return;
        }

        const newRows = [];
        results.forEach((res, fileIdx) => {
          const groupMark = extractGroupName(res.filename);
          const data = XLSX.utils.sheet_to_json(res.workbook.Sheets[res.workbook.SheetNames[0]], { defval: "" });
          if (data.length > 0) {
            Object.keys(data[0]).forEach(h => { if (h !== 'id' && h !== '_来源') originalHeaders.add(h); });
            originalHeaders.add('_来源');
            data.forEach((row, idx) => { row.id = `row-${Date.now()}-${fileIdx}-${idx}`; row._来源 = groupMark; newRows.push(row); });
          }
        });
        queue = [...queue, ...newRows].sort((a, b) => extractFields(a).rawTimeValue - extractFields(b).rawTimeValue);
        isLoaded = true;
        document.getElementById('actionButtons').classList.add('hidden');
        document.getElementById('activeControls').classList.remove('hidden');
        document.getElementById('headerInfo').classList.remove('hidden');
        document.getElementById('headerInfoText').innerText = `已合并！累计: ${queue.length} 行`;
        renderAll();
      } catch (error) { alert('文件读取出错: ' + error.message); }
    }

    const fileInput = document.getElementById('fileInput');
    document.getElementById('uploadBtn').onclick = () => fileInput.click();
    document.getElementById('appendBtn').onclick = () => fileInput.click();
    fileInput.onchange = (e) => { processFiles(e.target.files); fileInput.value = ''; };

    document.getElementById('mockBtn').onclick = () => {
      originalHeaders = new Set(Object.keys(MOCK_COMPLEX_DATA[0]));
      queue = [...MOCK_COMPLEX_DATA].sort((a, b) => extractFields(a).rawTimeValue - extractFields(b).rawTimeValue);
      isLoaded = true; windows.forEach(w => w.items = []); actionHistory = []; qqToWindowMapping = {};
      document.getElementById('actionButtons').classList.add('hidden');
      document.getElementById('activeControls').classList.remove('hidden');
      document.getElementById('headerInfo').classList.remove('hidden');
      document.getElementById('headerInfoText').innerText = `已加载测试数据`;
      renderAll();
    };

    document.getElementById('resetBtn').onclick = () => {
      queue = []; isLoaded = false; originalHeaders = new Set(); isRenamePanelOpen = false;
      actionHistory = []; qqToWindowMapping = {}; lockedWindowId = null; groupColorMapping = {};
      document.getElementById('renamePanel').classList.add('hidden');
      document.getElementById('lockTip').classList.add('hidden');
      windows = [
        { id: 'win-0', name: '水聊', color: PRESET_COLORS[0], items: [] },
        { id: 'win-1', name: 'HO1', color: PRESET_COLORS[1], items: [] },
        { id: 'win-2', name: 'HO2', color: PRESET_COLORS[2], items: [] },
        { id: 'win-3', name: 'HO3', color: PRESET_COLORS[3], items: [] }
      ];
      fileInput.value = '';
      document.getElementById('actionButtons').classList.remove('hidden');
      document.getElementById('activeControls').classList.add('hidden');
      document.getElementById('headerInfo').classList.add('hidden');
      renderAll();
    };

    window.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
      const key = e.key;
      if (key >= '0' && key <= '9') {
        const idx = parseInt(key, 10);
        if (idx < windows.length && queue.length > 0) sortItem(windows[idx].id);
      } else if (key === 'Enter') {
        e.preventDefault();
        const rec = getRecommendedWindow();
        if (rec && queue.length > 0) sortItem(rec.id);
      } else if (key === '.' || key === '。') {
        e.preventDefault();
        triggerUndo();
      }
    });

    renderAll();
  </script>
</body>
</html>
