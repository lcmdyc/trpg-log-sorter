<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>跑团log分拣整理系统</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- SheetJS (XLSX) CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * {
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    .window-drag-over {
      background-color: rgba(99, 102, 241, 0.05) !important;
      border-color: rgba(99, 102, 241, 0.8) !important;
      border-style: dashed !important;
    }
    .drop-indicator {
      height: 12px;
      margin-top: -6px;
      margin-bottom: -6px;
      transition: all 0.2s ease-out;
      position: relative;
      z-index: 10;
      border-radius: 8px;
      background-color: transparent;
    }
    .drop-indicator.active {
      height: 76px;
      margin-top: 4px;
      margin-bottom: 4px;
      background-color: rgba(99, 102, 241, 0.04);
      border: 2px dashed rgba(99, 102, 241, 0.4);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pulse-border {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0px rgba(99, 102, 241, 0.7); }
      50% { transform: scale(1.02); box-shadow: 0 0 0 8px rgba(99, 102, 241, 0); }
    }
    .recommend-pulse {
      animation: pulse-border 2s infinite;
      border-color: #4f46e5 !important;
      background-color: #e0e7ff !important;
      color: #312e81 !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen overflow-hidden flex flex-col">

  <!-- 顶部导航栏 -->
  <header class="flex items-center justify-between px-4 md:px-6 py-2 md:py-3 bg-white border-b border-slate-200/80 shrink-0 shadow-sm z-20">
    <div class="flex items-center space-x-2 md:space-x-3">
      <div class="p-1.5 bg-indigo-50 rounded-lg text-indigo-600 border border-indigo-100 shrink-0">
        <i data-lucide="layers" class="h-4 w-4 md:h-5 md:w-5"></i>
      </div>
      <div>
        <h1 class="text-sm md:text-base font-bold text-slate-900 tracking-wide">跑团log分拣系统</h1>
        <p class="hidden md:block text-[11px] text-slate-400">支持多文件并行合并 · 行内一键分流 · 15行双翼大布局</p>
      </div>
    </div>

    <!-- 顶部操作区 -->
    <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar pl-2">
      <div class="hidden lg:flex items-center space-x-1.5 text-xs text-slate-500 bg-slate-100 px-2.5 py-1 rounded-md border border-slate-200 shrink-0">
        <i data-lucide="keyboard" class="h-3.5 w-3.5 text-indigo-500"></i>
        <span>按 <b>0-9</b> 分拣首行，按 <b>Enter</b> 确认预判，按 <b>.</b> 撤回</span>
      </div>

      <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" multiple class="hidden" />

      <div id="actionButtons" class="flex items-center space-x-1.5 shrink-0">
        <button id="uploadBtn" class="flex items-center space-x-1 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs md:text-sm font-medium transition-all shadow-sm">
          <i data-lucide="upload" class="h-3.5 w-3.5"></i>
          <span>上传表格</span>
        </button>
        <button id="mockBtn" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs md:text-sm font-medium transition-all border border-slate-200">
          测试数据
        </button>
      </div>
      <div id="activeControls" class="hidden flex items-center space-x-1.5 shrink-0">
        <button id="undoBtn" disabled class="flex items-center space-x-1 px-2.5 py-1.5 bg-white text-slate-400 rounded-lg text-xs md:text-sm font-medium transition-all border border-slate-200 disabled:opacity-50 disabled:cursor-not-allowed">
          <i data-lucide="undo-2" class="h-3.5 w-3.5"></i>
          <span>撤回 (.)</span>
        </button>
        <button id="appendBtn" class="flex items-center space-x-1 px-2.5 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-lg text-xs md:text-sm font-medium transition-all border border-indigo-200">
          <i data-lucide="plus-circle" class="h-3.5 w-3.5"></i>
          <span>追加</span>
        </button>
        <button id="resetBtn" class="flex items-center space-x-1 px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs md:text-sm font-medium transition-all border border-slate-200">
          <i data-lucide="rotate-ccw" class="h-3.5 w-3.5"></i>
          <span>重置</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主体工作区 -->
  <main class="flex-1 flex flex-col lg:flex-row overflow-hidden p-3 md:p-4 gap-3 md:gap-4">
    
    <!-- 【左侧栏】：待处理队列（占据 48%，集成行内分流按钮） -->
    <section class="flex-[5.5] flex flex-col bg-white border border-slate-200/80 rounded-xl p-3 md:p-4 shadow-sm overflow-hidden min-h-[350px] lg:min-h-0">
      <div class="flex items-center justify-between mb-2 shrink-0">
        <div class="flex items-center space-x-2">
          <span class="flex h-2 w-2 rounded-full bg-slate-400"></span>
          <h2 class="text-xs md:text-sm font-bold text-slate-700 uppercase tracking-wider">待处理队列 (<span id="queueCount">0</span> 行)</h2>
          <span id="lockTip" class="hidden text-[10px] bg-amber-50 text-orange-600 border border-amber-200 px-1.5 py-0.2 rounded font-bold animate-pulse">
            🔒 锁定模式：点击行内文字区域直接送入锁定窗
          </span>
        </div>
        <div id="headerInfo" class="hidden flex items-center space-x-1 text-[9px] text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200 max-w-[40%] truncate">
          <span id="headerInfoText" class="truncate">已合并原始列字段</span>
        </div>
      </div>

      <!-- 15 行队列容器 -->
      <div id="queueList" class="flex-1 flex flex-col justify-start space-y-1 bg-slate-50/50 p-2 rounded-xl border border-slate-200/60 overflow-y-auto">
        <div class="h-full flex flex-col items-center justify-center text-slate-400 p-4 text-center">
          <i data-lucide="upload" class="h-8 w-8 mb-2 text-indigo-500/60 animate-bounce"></i>
          <p class="text-xs font-medium text-slate-600">请在右上角上传表格</p>
          <p class="text-[10px] text-slate-400 mt-1">支持多文件合并，按时间升序重排</p>
        </div>
      </div>
    </section>

    <!-- 【右侧栏】：分窗接收区 & 改名面板（占据 4.5%） -->
    <section class="flex-[4.5] flex flex-col gap-3 md:gap-4 overflow-hidden">
      
      <!-- 1. 分窗接收区 -->
      <div class="flex-1 min-h-[220px] flex flex-col bg-white border border-slate-200/80 rounded-xl p-3 md:p-4 shadow-sm overflow-hidden">
        <div class="flex items-center justify-between mb-2 shrink-0">
          <div class="flex items-center space-x-1.5">
            <span class="flex h-2 w-2 rounded-full bg-indigo-500"></span>
            <h2 class="text-xs md:text-sm font-bold text-slate-700 uppercase tracking-wider">分流接收窗口</h2>
          </div>
          <div class="flex items-center space-x-2">
            <button id="toggleRenameBtn" class="hidden flex items-center space-x-1 px-2 py-0.5 text-[10px] bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded border border-indigo-200 transition font-bold">
              <i data-lucide="user-cog" class="h-3 w-3"></i>
              <span>整理发送者 (改名/删除)</span>
            </button>
            <button id="addWindowBtn" class="flex items-center space-x-1 px-2 py-0.5 text-[10px] md:text-xs bg-slate-50 hover:bg-slate-100 text-indigo-600 rounded border border-slate-200 transition font-medium">
              <i data-lucide="plus" class="h-3 w-3"></i>
              <span>增加分窗</span>
            </button>
          </div>
        </div>

        <!-- 横向排布容器 -->
        <div id="windowsContainer" class="flex-1 flex gap-2.5 overflow-x-auto pb-1 pr-1">
          <!-- 动态渲染分窗 -->
        </div>
      </div>

      <!-- 2. 绝对定位/弹性展开的“重命名与过滤面板” -->
      <div id="renamePanel" class="hidden shrink-0 bg-indigo-50/40 border border-indigo-100 rounded-xl p-2.5 max-h-[180px] overflow-y-auto shadow-inner">
        <div class="text-[10px] font-bold text-indigo-800 mb-1.5 flex items-center justify-between">
          <span>👤 发送者初始整理（支持一键改名，或点击红色垃圾桶删除该QQ全部记录）</span>
          <span class="text-[9px] text-indigo-500 font-normal">基于 QQ号/发送者ID 匹配</span>
        </div>
        <div id="renameList" class="space-y-1.5">
          <!-- 动态渲染发送者列表 -->
        </div>
      </div>

    </section>
  </main>

  <script>
    const PRESET_COLORS = [
      { border: 'border-pink-200', bg: 'bg-pink-50/60', text: 'text-pink-600', btn: 'bg-pink-500 hover:bg-pink-600 text-white shadow-pink-100' }, 
      { border: 'border-blue-200', bg: 'bg-blue-50/60', text: 'text-blue-600', btn: 'bg-blue-500 hover:bg-blue-600 text-white shadow-blue-100' },
      { border: 'border-emerald-200', bg: 'bg-emerald-50/60', text: 'text-emerald-600', btn: 'bg-emerald-500 hover:bg-emerald-600 text-white shadow-emerald-100' },
      { border: 'border-purple-200', bg: 'bg-purple-50/60', text: 'text-purple-600', btn: 'bg-purple-500 hover:bg-purple-600 text-white shadow-purple-100' },
      { border: 'border-orange-200', bg: 'bg-orange-50/60', text: 'text-orange-600', btn: 'bg-orange-500 hover:bg-orange-600 text-white shadow-orange-100' },
      { border: 'border-cyan-200', bg: 'bg-cyan-50/60', text: 'text-cyan-600', btn: 'bg-cyan-500 hover:bg-cyan-600 text-white shadow-cyan-100' },
    ];

    const MOCK_COMPLEX_DATA = [
      { id: 'mock-1', 时间: '2026-10-04T02:01:10.000Z', 发送者: '张三-HO1', 发送者QQ号: '10001', 消息内容: '哈喽哈喽，大家早上好呀！', _来源: '群聊A' },
      { id: 'mock-2', 时间: '2026-10-04T02:02:15.000Z', 发送者: '李四-HO2', 发送者QQ号: '10002', 消息内容: '早！今天晚上有人开团吗？求带！', _来源: '群聊A' },
      { id: 'mock-3', 时间: '2026-10-04T02:03:00.000Z', 发送者: '张小三', 发送者QQ号: '10001', 消息内容: '滴滴，有人在吗？帮我看看这个卡怎么建。', _来源: '群聊B' },
      { id: 'mock-4', 时间: '2026-10-04T02:04:22.000Z', 发送者: '旁观者NPC', 发送者QQ号: '99999', 消息内容: '【系统提示：请遵守群规】', _来源: '群聊B' },
      { id: 'mock-5', 时间: '2026-10-04T02:05:40.000Z', 发送者: '李大四', 发送者QQ号: '10002', 消息内容: '新人报道，请多多指教~', _来源: '群聊C' },
      { id: 'mock-6', 时间: '2026-10-04T02:06:10.000Z', 发送者: '张三-HO1', 发送者QQ号: '10001', 消息内容: '我的角色卡已经做好了，KP看看？', _来源: '群聊A' },
      { id: 'mock-7', 时间: '2026-10-04T02:07:15.000Z', 发送者: '张三-HO1', 发送者QQ号: '10001', 消息内容: '属性是：力量 60，敏捷 70，意志 80。', _来源: '群聊A' },
      { id: 'mock-8', 时间: '2026-10-04T02:08:00.000Z', 发送者: '张三-HO1', 发送者QQ号: '10001', 消息内容: '技能点我全加在侦查和图书馆了。', _来源: '群聊A' },
      { id: 'mock-9', 时间: '2026-10-04T02:09:12.000Z', 发送者: 'KP-奈亚', 发送者QQ号: '88888', 消息内容: '收到，卡没问题，准备导入。', _来源: '群聊A' },
      { id: 'mock-10', 时间: '2026-10-04T02:10:05.000Z', 发送者: 'KP-奈亚', 发送者QQ号: '88888', 消息内容: '今晚 8 点准时开跑，请大家提前准备好骰子。', _来源: '群聊A' },
    ];

    let windows = [
      { id: 'win-0', name: '水聊', color: PRESET_COLORS[0], items: [] },
      { id: 'win-1', name: 'HO1', color: PRESET_COLORS[1], items: [] },
      { id: 'win-2', name: 'HO2', color: PRESET_COLORS[2], items: [] },
      { id: 'win-3', name: 'HO3', color: PRESET_COLORS[3], items: [] },
      { id: 'win-4', name: 'HO4', color: PRESET_COLORS[4], items: [] },
    ];
    let queue = [];
    let isLoaded = false;
    let originalHeaders = new Set(); 
    let isRenamePanelOpen = false;
    let lockedWindowId = null;
    let qqToWindowMapping = {};
    let actionHistory = [];
    let draggedItemId = null;
    let draggedSourceWindowId = null;

    function extractGroupName(filename) {
      if (!filename) return '未知来源';
      if (filename.startsWith('group_')) {
        const parts = filename.split('_');
        if (parts.length > 1 && parts[1]) return parts[1]; 
      }
      const nameWithoutExt = filename.substring(0, filename.lastIndexOf('.')) || filename;
      return nameWithoutExt.length > 8 ? nameWithoutExt.substring(0, 8) + '...' : nameWithoutExt;
    }

    function extractFields(row) {
      return {
        displayTime: row['时间'] || '',
        displaySender: row['发送者'] || '未知发送者',
        displayContent: row['消息内容'] || '（无消息内容）',
        rawTimeValue: row['时间'] ? new Date(row['时间']).getTime() : 0
      };
    }

    function getRowQQ(row) {
      return row['发送者QQ号'] || row['发送者QQ'] || row['QQ'] || row['发送者id'] || row['发送者ID'] || '无QQ号';
    }

    function formatOnlyTime(isoString) {
      if (!isoString) return '';
      if (typeof isoString !== 'string') return String(isoString);
      return isoString.includes('T') ? isoString.split('T')[1].split('.')[0] : isoString;
    }

    function getRecommendedWindow() {
      if (queue.length === 0) return null;
      const firstItem = queue[0];
      const qq = getRowQQ(firstItem);
      const recommendedWinId = qqToWindowMapping[qq];
      if (recommendedWinId) {
        const win = windows.find(w => w.id === recommendedWinId);
        return win ? win : null;
      }
      return null;
    }

    function renderAll() {
      renderWindows();
      renderQueue();
      renderRenameList();
      updateUndoButtonState();
      lucide.createIcons();
    }

    function renderWindows() {
      const container = document.getElementById('windowsContainer');
      container.innerHTML = '';

      windows.forEach((win, index) => {
        const winEl = document.createElement('div');
        winEl.id = `window-box-${win.id}`;
        
        const isLocked = lockedWindowId === win.id;
        winEl.className = `flex flex-col w-48 md:w-56 shrink-0 rounded-xl border-2 transition-all duration-200 ${
          isLocked 
            ? 'border-indigo-600 bg-indigo-50/40 shadow-lg ring-2 ring-indigo-100' 
            : `${win.color.border} ${win.color.bg} shadow-sm`
        }`;
        
        winEl.addEventListener('dragover', (e) => {
          e.preventDefault();
          winEl.classList.add('window-drag-over');
        });
        winEl.addEventListener('dragleave', () => {
          winEl.classList.remove('window-drag-over');
        });
        winEl.addEventListener('drop', (e) => {
          e.preventDefault();
          winEl.classList.remove('window-drag-over');
          handleCardDrop(win.id, null);
        });

        let itemsHtml = '';
        if (win.items.length === 0) {
          itemsHtml = `
            <div class="h-full flex flex-col items-center justify-center text-slate-400 py-6 md:py-10">
              <i data-lucide="file-spreadsheet" class="h-5 w-5 mb-1 opacity-40"></i>
              <span class="text-[9px] md:text-[10px]">等待分拣</span>
            </div>
          `;
        } else {
          win.items.forEach((item, itemIdx) => {
            const info = extractFields(item);
            const sourceLabel = item._来源 || '未知';
            
            itemsHtml += `
              <div 
                class="drop-indicator"
                ondragover="handleIndicatorDragOver(event, this)"
                ondragleave="handleIndicatorDragLeave(this)"
                ondrop="handleIndicatorDrop(event, '${win.id}', ${itemIdx}, this)"
              ></div>
            `;

            itemsHtml += `
              <div 
                draggable="true"
                ondragstart="handleCardDragStart(event, '${item.id}', '${win.id}')"
                ondragend="handleCardDragEnd(event)"
                class="p-2 bg-white rounded-lg border border-slate-200/80 hover:border-slate-300 hover:shadow-md transition-all duration-200 cursor-grab active:cursor-grabbing"
              >
                <div class="flex justify-between text-[8px] md:text-[9px] text-slate-400 mb-0.5 pointer-events-none">
                  <span class="font-bold text-slate-600 truncate max-w-[70px]" title="${info.displaySender}">${info.displaySender}</span>
                  <span class="font-mono">${formatOnlyTime(info.displayTime)}</span>
                </div>
                <div class="font-semibold text-[10px] md:text-[11px] text-slate-700 truncate mb-1 pointer-events-none" title="${info.displayContent}">${info.displayContent}</div>
                <div class="text-[8px] text-indigo-500 bg-indigo-50/50 px-1 py-0.2 rounded border border-indigo-100/50 inline-block truncate max-w-full pointer-events-none">
                  ${sourceLabel}
                </div>
              </div>
            `;
          });

          itemsHtml += `
            <div 
              class="drop-indicator"
              ondragover="handleIndicatorDragOver(event, this)"
              ondragleave="handleIndicatorDragLeave(this)"
              ondrop="handleIndicatorDrop(event, '${win.id}', ${win.items.length}, this)"
            ></div>
          `;
        }

        winEl.innerHTML = `
          <div class="px-2.5 py-1.5 flex items-center justify-between border-b border-slate-200/60 bg-white/80 backdrop-blur-sm shrink-0">
            <div class="flex items-center space-x-1">
              <input 
                type="checkbox" 
                ${isLocked ? 'checked' : ''} 
                onchange="toggleLockWindow('${win.id}', this.checked)"
                title="锁定此窗口"
                class="h-3.5 w-3.5 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500 cursor-pointer"
              />
              <span class="flex items-center justify-center w-3.5 h-3.5 rounded bg-slate-200 text-slate-600 text-[9px] font-bold shrink-0">
                ${index}
              </span>
              <input 
                type="text" 
                value="${win.name}" 
                onchange="renameWindow('${win.id}', this.value)"
                class="bg-transparent font-bold text-[11px] md:text-xs text-slate-800 focus:outline-none focus:bg-slate-50 rounded px-0.5 py-0.5 w-14 md:w-20 border border-transparent hover:border-slate-200"
              />
            </div>
            <div class="flex items-center space-x-0.5 shrink-0">
              <button onclick="exportWindow('${win.id}')" title="导出" class="p-1 hover:bg-slate-100 rounded text-slate-500 hover:text-emerald-600 transition">
                <i data-lucide="download" class="h-3 w-3"></i>
              </button>
              <button onclick="removeWindow('${win.id}')" title="删除" class="p-1 hover:bg-slate-100 rounded text-slate-500 hover:text-rose-600 transition">
                <i data-lucide="trash-2" class="h-3 w-3"></i>
              </button>
            </div>
          </div>
          <div id="window-scroll-${win.id}" class="flex-1 p-2 overflow-y-auto space-y-0.5">
            ${itemsHtml}
          </div>
          <div class="px-2.5 py-1 bg-white/80 text-[9px] md:text-[10px] text-slate-500 flex justify-between border-t border-slate-200/60 shrink-0">
            <span>${isLocked ? '🔒 已锁定' : '已收集'}</span>
            <span class="font-bold ${win.color.text}">${win.items.length} 行</span>
          </div>
        `;
        container.appendChild(winEl);
      });
    }

    window.toggleLockWindow = function(winId, checked) {
      if (checked) {
        lockedWindowId = winId;
        document.getElementById('lockTip').classList.remove('hidden');
      } else {
        if (lockedWindowId === winId) {
          lockedWindowId = null;
          document.getElementById('lockTip').classList.add('hidden');
        }
      }
      renderAll();
    };

    window.handleCardDragStart = function(e, itemId, sourceWinId) {
      draggedItemId = itemId;
      draggedSourceWindowId = sourceWinId;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => { e.target.classList.add('opacity-30'); }, 0);
    };

    window.handleCardDragEnd = function(e) {
      e.target.classList.remove('opacity-30');
    };

    window.handleIndicatorDragOver = function(e, indicator) {
      e.preventDefault();
      e.stopPropagation();
      indicator.classList.add('active');
    };

    window.handleIndicatorDragLeave = function(indicator) {
      indicator.classList.remove('active');
    };

    window.handleIndicatorDrop = function(e, targetWinId, targetIdx, indicator) {
      e.preventDefault();
      e.stopPropagation();
      indicator.classList.remove('active');
      handleCardDrop(targetWinId, targetIdx);
    };

    function handleCardDrop(targetWinId, targetIdx) {
      if (!draggedItemId || !draggedSourceWindowId) return;
      const sourceWin = windows.find(w => w.id === draggedSourceWindowId);
      const targetWin = windows.find(w => w.id === targetWinId);
      if (!sourceWin || !targetWin) return;

      const itemIdx = sourceWin.items.findIndex(item => item.id === draggedItemId);
      if (itemIdx === -1) return;

      const draggedItem = sourceWin.items[itemIdx];
      pushAction({
        type: 'drag',
        sourceWinId: draggedSourceWindowId,
        targetWinId: targetWinId,
        itemId: draggedItemId,
        originalIdx: itemIdx,
        targetIdx: targetIdx === null ? targetWin.items.length : targetIdx
      });

      sourceWin.items.splice(itemIdx, 1);
      if (targetIdx === null) {
        targetWin.items.push(draggedItem);
      } else {
        let adjustedIdx = targetIdx;
        if (draggedSourceWindowId === targetWinId && targetIdx > itemIdx) {
          adjustedIdx = targetIdx - 1;
        }
        targetWin.items.splice(adjustedIdx, 0, draggedItem);
      }

      const qq = getRowQQ(draggedItem);
      qqToWindowMapping[qq] = targetWinId;
      draggedItemId = null;
      draggedSourceWindowId = null;
      renderAll();
      scrollWindowToBottom(targetWinId);
    }

    // 行内直接分流（支持乱序分流）
    window.sortItemDirectly = function(e, itemIndex, windowId) {
      e.stopPropagation(); // 阻止触发锁定模式的整行点击
      if (itemIndex < queue.length) {
        const item = queue.splice(itemIndex, 1)[0];
        const win = windows.find(w => w.id === windowId);
        if (win) {
          win.items.push(item);
          pushAction({
            type: 'click_sort',
            windowId: windowId,
            item: item,
            originalIdx: itemIndex
          });
          const qq = getRowQQ(item);
          qqToWindowMapping[qq] = windowId;
        }
        renderAll();
        scrollWindowToBottom(windowId);
      }
    };

    // 整行点击分流（仅在锁定模式下生效）
    window.handleQueueRowClick = function(itemIndex) {
      if (!lockedWindowId) return;
      if (itemIndex < queue.length) {
        const item = queue.splice(itemIndex, 1)[0];
        const win = windows.find(w => w.id === lockedWindowId);
        if (win) {
          win.items.push(item);
          pushAction({
            type: 'click_sort',
            windowId: lockedWindowId,
            item: item,
            originalIdx: itemIndex
          });
          const qq = getRowQQ(item);
          qqToWindowMapping[qq] = lockedWindowId;
        }
        renderAll();
        scrollWindowToBottom(lockedWindowId);
      }
    };

    // 渲染待处理队列 (支持 15 行，集成行内分流按钮)
    function renderQueue() {
      document.getElementById('queueCount').innerText = queue.length;
      const listContainer = document.getElementById('queueList');
      listContainer.innerHTML = '';

      if (!isLoaded) {
        listContainer.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-slate-400 p-4 text-center">
            <i data-lucide="upload" class="h-8 w-8 mb-2 text-indigo-500/60 animate-bounce"></i>
            <p class="text-xs font-medium text-slate-600">请在右上角上传表格</p>
            <p class="text-[10px] text-slate-400 mt-1">支持多文件合并，按时间升序重排</p>
          </div>
        `;
        document.getElementById('headerInfo').classList.add('hidden');
        document.getElementById('toggleRenameBtn').classList.add('hidden');
        return;
      }

      document.getElementById('toggleRenameBtn').classList.remove('hidden');

      if (queue.length === 0) {
        listContainer.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-slate-500 p-4 text-center">
            <i data-lucide="check-circle-2" class="h-8 w-8 mb-2 text-emerald-500"></i>
            <p class="text-xs text-emerald-600 font-bold">所有数据分拣完毕！</p>
            <p class="text-[10px] text-slate-400 mt-1">点击右侧窗口的下载图标即可导出数据</p>
          </div>
        `;
        return;
      }

      const maxLinesToShow = window.innerWidth < 768 ? 6 : 15;
      const recommendedWin = getRecommendedWindow();

      for (let i = 0; i < maxLinesToShow; i++) {
        const item = queue[i];
        const itemEl = document.createElement('div');
        
        if (!item) {
          itemEl.className = "flex-1 min-h-[44px] border border-dashed border-slate-200 rounded-lg flex items-center justify-center text-slate-300 text-[10px]";
          itemEl.innerText = "(空闲槽位)";
        } else {
          const isFirst = i === 0;
          const info = extractFields(item);
          const sourceLabel = item._来源 || '未知';
          const hoverClass = lockedWindowId ? 'hover:bg-indigo-50/40 hover:border-indigo-300 cursor-pointer active:scale-[0.99]' : '';

          // 动态构建右侧行内分流按钮
          let rowButtonsHtml = '';
          windows.forEach((win, winIdx) => {
            const isRec = isFirst && recommendedWin && recommendedWin.id === win.id;
            // 缩写名字，如果是水聊用“水”，HO1用“H1”，其他取前两个字符
            const shortName = win.name === '水聊' ? '水' : (win.name.startsWith('HO') ? win.name.replace('HO', 'H') : win.name.substring(0, 2));
            
            rowButtonsHtml += `
              <button 
                onclick="sortItemDirectly(event, ${i}, '${win.id}')"
                title="分流至: ${win.name}"
                class="px-1.5 py-1 text-[9px] font-extrabold rounded border transition-all active:scale-90 ${
                  isRec 
                    ? 'bg-indigo-600 border-indigo-700 text-white animate-pulse ring-1 ring-indigo-300' 
                    : 'bg-slate-100 hover:bg-slate-200 border-slate-200 text-slate-700'
                }"
              >
                ${shortName}
              </button>
            `;
          });

          itemEl.className = `flex-1 min-h-[48px] flex items-center justify-between px-2.5 py-1 rounded-lg border transition-all ${hoverClass} ${
            isFirst ? 'bg-white border-indigo-300 shadow-sm ring-1 ring-indigo-100' : 'bg-white/60 border-slate-200/60 opacity-85'
          }`;

          itemEl.onclick = () => handleQueueRowClick(i);
          itemEl.innerHTML = `
            <!-- 左侧：序号 -->
            <div class="flex items-center space-x-1 shrink-0">
              <span class="w-4 h-4 rounded-full flex items-center justify-center text-[10px] font-black ${
                isFirst ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-500'
              }">
                ${i + 1}
              </span>
            </div>
            
            <!-- 来源 -->
            <div class="w-12 shrink-0 ml-1">
              <div class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-1 py-0.2 rounded border border-indigo-100 inline-block truncate max-w-[42px]" title="${sourceLabel}">
                ${sourceLabel}
              </div>
            </div>

            <!-- 发送者 -->
            <div class="w-16 md:w-24 shrink-0 ml-1">
              <div class="text-xs font-black text-slate-800 truncate max-w-[58px] md:max-w-[90px]" title="${info.displaySender}">${info.displaySender}</div>
            </div>

            <!-- 消息内容 -->
            <div class="flex-1 min-w-0 mr-2 ml-1">
              <div class="text-xs text-slate-900 font-bold truncate" title="${info.displayContent}">${info.displayContent}</div>
            </div>

            <!-- 右侧：行内分拣按钮组 -->
            <div class="flex items-center space-x-0.5 shrink-0">
              ${rowButtonsHtml}
            </div>
          `;
        }
        listContainer.appendChild(itemEl);
      }
    }

    function renderRenameList() {
      const panel = document.getElementById('renamePanel');
      const list = document.getElementById('renameList');
      list.innerHTML = '';

      if (!isLoaded) {
        panel.classList.add('hidden');
        return;
      }

      const qqToNames = {};
      const allItems = [...queue];
      windows.forEach(w => allItems.push(...w.items));

      allItems.forEach(item => {
        const qq = getRowQQ(item);
        const name = item['发送者'] || '未知发送者';
        if (!qqToNames[qq]) qqToNames[qq] = new Set();
        qqToNames[qq].add(name);
      });

      const qqList = Object.keys(qqToNames);
      if (qqList.length === 0) {
        list.innerHTML = `<div class="text-[10px] text-slate-400">未检测到发送者QQ号或ID字段</div>`;
        return;
      }

      qqList.forEach(qq => {
        const namesArray = Array.from(qqToNames[qq]);
        const namesStr = namesArray.join(' / ');

        const row = document.createElement('div');
        row.id = `rename-row-${qq}`;
        row.className = "flex items-center justify-between bg-white p-1.5 rounded-lg border border-indigo-100/60 shadow-sm gap-2 transition-all duration-200";
        row.innerHTML = `
          <div class="flex-1 min-w-0">
            <div class="flex items-center space-x-1">
              <span class="text-[9px] font-mono text-indigo-600 bg-indigo-50 px-1 rounded border border-indigo-100 shrink-0">QQ: ${qq}</span>
              <span class="text-[10px] font-bold text-slate-700 truncate" title="${namesStr}">${namesStr}</span>
            </div>
          </div>
          <div class="flex items-center space-x-1 shrink-0">
            <input type="text" placeholder="新名字" id="rename-input-${qq}" onfocus="highlightRenameRow('${qq}', true)" onblur="highlightRenameRow('${qq}', false)" class="w-16 md:w-28 text-[10px] px-1.5 py-0.5 border border-slate-200 focus:outline-none focus:border-indigo-500 rounded bg-slate-50/50" />
            <button onclick="applyGlobalRename('${qq}')" class="px-1.5 py-0.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-[9px] font-bold transition">改名</button>
            <button onclick="deleteQQRecords('${qq}', '${namesStr}')" class="p-1 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded border border-rose-200 transition"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
          </div>
        `;
        list.appendChild(row);
      });
    }

    window.highlightRenameRow = function(qq, isFocused) {
      const row = document.getElementById(`rename-row-${qq}`);
      if (!row) return;
      if (isFocused) {
        row.classList.remove('bg-white', 'border-indigo-100/60', 'shadow-sm');
        row.classList.add('bg-indigo-50/80', 'border-indigo-400', 'shadow-md', 'scale-[1.01]');
      } else {
        row.classList.remove('bg-indigo-50/80', 'border-indigo-400', 'shadow-md', 'scale-[1.01]');
        row.classList.add('bg-white', 'border-indigo-100/60', 'shadow-sm');
      }
    };

    window.applyGlobalRename = function(qq) {
      const input = document.getElementById(`rename-input-${qq}`);
      if (!input) return;
      const newName = input.value.trim();
      if (!newName) return alert('请输入新名字');

      const oldNamesMap = [];
      const recordOldName = (item) => {
        const itemQQ = getRowQQ(item);
        if (String(itemQQ) === String(qq)) {
          oldNamesMap.push({ id: item.id, oldName: item['发送者'] });
          item['发送者'] = newName;
        }
      };

      queue.forEach(recordOldName);
      windows.forEach(win => win.items.forEach(recordOldName));
      pushAction({ type: 'rename', qq: qq, oldNamesMap: oldNamesMap });
      renderAll();
    };

    window.deleteQQRecords = function(qq, namesStr) {
      if (!confirm(`确定要彻底删除 QQ [${qq}] (${namesStr}) 的所有聊天记录吗？此操作不可撤销。`)) return;

      const deletedQueueItems = queue.filter(item => String(getRowQQ(item)) === String(qq));
      const deletedWinItems = [];

      queue = queue.filter(item => String(getRowQQ(item)) !== String(qq));
      windows.forEach(win => {
        const winDeleted = win.items.filter(item => String(getRowQQ(item)) === String(qq));
        if (winDeleted.length > 0) deletedWinItems.push({ winId: win.id, items: winDeleted });
        win.items = win.items.filter(item => String(getRowQQ(item)) !== String(qq));
      });

      pushAction({ type: 'delete_qq', qq: qq, deletedQueueItems: deletedQueueItems, deletedWinItems: deletedWinItems });
      alert(`已成功删除该 QQ 号的所有记录！`);
      renderAll();
    };

    document.getElementById('toggleRenameBtn').onclick = () => {
      isRenamePanelOpen = !isRenamePanelOpen;
      const panel = document.getElementById('renamePanel');
      isRenamePanelOpen ? panel.classList.remove('hidden') : panel.classList.add('hidden');
    };

    function sortItem(windowId) {
      if (queue.length === 0) return;
      const item = queue.shift();
      const win = windows.find(w => w.id === windowId);
      if (win) {
        win.items.push(item);
        qqToWindowMapping[getRowQQ(item)] = windowId;
        pushAction({ type: 'sort', windowId: windowId, item: item });
      }
      renderAll();
      scrollWindowToBottom(windowId);
    }

    function scrollWindowToBottom(windowId) {
      setTimeout(() => {
        const el = document.getElementById(`window-scroll-${windowId}`);
        if (el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
      }, 50);
    }

    function pushAction(action) {
      actionHistory.push(action);
      updateUndoButtonState();
    }

    function updateUndoButtonState() {
      const btn = document.getElementById('undoBtn');
      if (btn) {
        if (actionHistory.length > 0) {
          btn.disabled = false;
          btn.className = "flex items-center space-x-1 px-2.5 py-1.5 bg-white text-indigo-600 rounded-lg text-xs md:text-sm font-medium transition-all border border-indigo-200 hover:bg-indigo-50";
        } else {
          btn.disabled = true;
          btn.className = "flex items-center space-x-1 px-2.5 py-1.5 bg-white text-slate-400 rounded-lg text-xs md:text-sm font-medium transition-all border border-slate-200 disabled:opacity-50 disabled:cursor-not-allowed";
        }
      }
    }

    window.triggerUndo = function() {
      if (actionHistory.length === 0) return;
      const act = actionHistory.pop();

      if (act.type === 'sort') {
        const win = windows.find(w => w.id === act.windowId);
        if (win && win.items.length > 0) queue.unshift(win.items.pop());
      } 
      else if (act.type === 'click_sort') {
        const win = windows.find(w => w.id === act.windowId);
        if (win && win.items.length > 0) queue.splice(act.originalIdx, 0, win.items.pop());
      }
      else if (act.type === 'drag') {
        const sWin = windows.find(w => w.id === act.sourceWinId);
        const tWin = windows.find(w => w.id === act.targetWinId);
        if (sWin && tWin) {
          const idx = tWin.items.findIndex(item => item.id === act.itemId);
          if (idx !== -1) {
            const [item] = tWin.items.splice(idx, 1);
            sWin.items.splice(act.originalIdx, 0, item);
            scrollWindowToBottom(act.sourceWinId);
          }
        }
      } 
      else if (act.type === 'rename') {
        const restore = (item) => {
          const match = act.oldNamesMap.find(r => r.id === item.id);
          if (match) item['发送者'] = match.oldName;
        };
        queue.forEach(restore);
        windows.forEach(w => w.items.forEach(restore));
      } 
      else if (act.type === 'delete_qq') {
        queue = [...queue, ...act.deletedQueueItems].sort((a, b) => extractFields(a).rawTimeValue - extractFields(b).rawTimeValue);
        act.deletedWinItems.forEach(rec => {
          const win = windows.find(w => w.id === rec.winId);
          if (win) win.items = [...win.items, ...rec.items].sort((a, b) => extractFields(a).rawTimeValue - extractFields(b).rawTimeValue);
        });
      }
      renderAll();
    };

    document.getElementById('undoBtn').onclick = () => triggerUndo();

    function renameWindow(id, newName) {
      const win = windows.find(w => w.id === id);
      if (win) win.name = newName;
      renderAll();
    }

    function removeWindow(id) {
      const win = windows.find(w => w.id === id);
      if (win && win.items.length > 0) {
        queue = [...queue, ...win.items].sort((a, b) => extractFields(a).rawTimeValue - extractFields(b).rawTimeValue);
      }
      windows = windows.filter(w => w.id !== id);
      renderAll();
    }

    document.getElementById('addWindowBtn').onclick = () => {
      if (windows.length >= 10) return alert('最多支持 10 个分窗');
      windows.push({ id: `win-${windows.length}`, name: `新分窗 ${windows.length}`, color: PRESET_COLORS[windows.length % PRESET_COLORS.length], items: [] });
      renderAll();
    };

    window.exportWindow = function(windowId) {
      const win = windows.find(w => w.id === windowId);
      if (!win || win.items.length === 0) return alert('该分窗暂无数据');
      const headers = Array.from(originalHeaders);
      const csvContent = [headers, ...win.items.map(item => headers.map(h => {
        const val = String(item[h] !== undefined ? item[h] : '');
        return val.includes(',') ? `"${val}"` : val;
      }))].map(e => e.join(",")).join("\n");

      const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `${win.name}_完整导出.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    function readFileAsync(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            resolve({ data: XLSX.utils.sheet_to_json(sheet, { defval: "" }), filename: file.name });
          } catch (err) { reject(err); }
        };
        reader.onerror = (err) => reject(err);
        reader.readAsArrayBuffer(file);
      });
    }

    async function processFiles(files) {
      if (files.length === 0) return;
      try {
        const results = await Promise.all(Array.from(files).map(file => readFileAsync(file)));
        const newRows = [];
        results.forEach((res, fileIdx) => {
          const groupMark = extractGroupName(res.filename);
          if (res.data.length > 0) {
            Object.keys(res.data[0]).forEach(h => { if (h !== 'id' && h !== '_来源') originalHeaders.add(h); });
            originalHeaders.add('_来源');
            res.data.forEach((row, idx) => {
              row.id = `row-${Date.now()}-${fileIdx}-${idx}`;
              row._来源 = groupMark;
              newRows.push(row);
            });
          }
        });
        queue = [...queue, ...newRows].sort((a, b) => extractFields(a).rawTimeValue - extractFields(b).rawTimeValue);
        isLoaded = true;
        document.getElementById('actionButtons').classList.add('hidden');
        document.getElementById('activeControls').classList.remove('hidden');
        document.getElementById('headerInfo').classList.remove('hidden');
        document.getElementById('headerInfoText').innerText = `已合并！累计: ${queue.length} 行`;
        renderAll();
      } catch (error) { alert('文件读取出错'); }
    }

    const fileInput = document.getElementById('fileInput');
    document.getElementById('uploadBtn').onclick = () => fileInput.click();
    document.getElementById('appendBtn').onclick = () => fileInput.click();
    fileInput.onchange = (e) => { processFiles(e.target.files); fileInput.value = ''; };

    document.getElementById('mockBtn').onclick = () => {
      originalHeaders = new Set(Object.keys(MOCK_COMPLEX_DATA[0]));
      queue = [...MOCK_COMPLEX_DATA].sort((a, b) => extractFields(a).rawTimeValue - extractFields(b).rawTimeValue);
      isLoaded = true;
      windows.forEach(w => w.items = []);
      actionHistory = []; qqToWindowMapping = {};
      document.getElementById('actionButtons').classList.add('hidden');
      document.getElementById('activeControls').classList.remove('hidden');
      document.getElementById('headerInfo').classList.remove('hidden');
      document.getElementById('headerInfoText').innerText = `已加载测试数据`;
      renderAll();
    };

    document.getElementById('resetBtn').onclick = () => {
      queue = []; isLoaded = false; originalHeaders = new Set(); isRenamePanelOpen = false;
      actionHistory = []; qqToWindowMapping = {}; lockedWindowId = null;
      document.getElementById('renamePanel').classList.add('hidden');
      document.getElementById('lockTip').classList.add('hidden');
      windows = [
        { id: 'win-0', name: '水聊', color: PRESET_COLORS[0], items: [] },
        { id: 'win-1', name: 'HO1', color: PRESET_COLORS[1], items: [] },
        { id: 'win-2', name: 'HO2', color: PRESET_COLORS[2], items: [] },
        { id: 'win-3', name: 'HO3', color: PRESET_COLORS[3], items: [] },
        { id: 'win-4', name: 'HO4', color: PRESET_COLORS[4], items: [] },
      ];
      fileInput.value = '';
      document.getElementById('actionButtons').classList.remove('hidden');
      document.getElementById('activeControls').classList.add('hidden');
      document.getElementById('headerInfo').classList.add('hidden');
      renderAll();
    };

    // 键盘快捷键监听 (已精简闭合)
    window.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
      const key = e.key;
      if (key >= '0' && key <= '9') {
        const idx = parseInt(key, 10);
        if (idx < windows.length && queue.length > 0) sortItem(windows[idx].id);
      } else if (key === 'Enter') {
        e.preventDefault();
        const rec = getRecommendedWindow();
        if (rec && queue.length > 0) sortItem(rec.id);
      } else if (key === '.' || key === '。') {
        e.preventDefault();
        triggerUndo();
      }
    });

    renderAll();
  </script>
</body>
</html>
