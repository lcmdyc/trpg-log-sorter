<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>跑团log分拣系统 - 移动端</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 竖屏提示遮罩 */
    @media (orientation: portrait) {
      #portrait-gate { display: flex !important; }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen overflow-hidden flex flex-col">

  <!-- 竖屏强制引导遮罩 -->
  <div id="portrait-gate" class="hidden fixed inset-0 bg-slate-950 z-50 flex-col items-center justify-center p-6 text-center">
    <div class="p-4 bg-indigo-500/10 rounded-full text-indigo-400 mb-4 animate-bounce">
      <i data-lucide="rotate-cw" class="h-12 w-12"></i>
    </div>
    <h2 class="text-lg font-bold text-white mb-2">请旋转手机至横屏</h2>
    <p class="text-xs text-slate-400 max-w-xs">跑团分拣系统需要较宽的视野，横屏操作才能获得最完美的双翼分流体验哦！</p>
  </div>

  <!-- 顶部导航栏 (高度压缩版) -->
  <header class="flex items-center justify-between px-4 py-1.5 bg-slate-950 border-b border-slate-800 shrink-0 z-20">
    <div class="flex items-center space-x-2">
      <div class="p-1 bg-indigo-600 rounded text-white">
        <i data-lucide="layers" class="h-3.5 w-3.5"></i>
      </div>
      <div>
        <h1 class="text-xs font-bold text-white tracking-wide">跑团分拣 (移动端)</h1>
      </div>
    </div>

    <!-- 移动端紧凑操作区 -->
    <div class="flex items-center space-x-1.5">
      <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" class="hidden" />
      
      <div id="actionButtons" class="flex items-center space-x-1">
        <button id="uploadBtn" class="flex items-center space-x-1 px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-[11px] font-bold">
          <i data-lucide="upload" class="h-3 w-3"></i>
          <span>导入 / 进度</span>
        </button>
      </div>

      <div id="activeControls" class="hidden flex items-center space-x-1">
        <button id="saveProgressBtn" class="flex items-center space-x-1 px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-[11px] font-bold">
          <i data-lucide="save" class="h-3 w-3"></i>
          <span>保存</span>
        </button>
        <button id="undoBtn" disabled class="flex items-center space-x-1 px-2 py-1 bg-slate-800 text-slate-500 rounded text-[11px] border border-slate-700 disabled:opacity-40">
          <i data-lucide="undo-2" class="h-3 w-3"></i>
          <span>撤回</span>
        </button>
        <button id="resetBtn" class="px-2 py-1 bg-slate-800 text-slate-300 rounded text-[11px] border border-slate-700">
          重置
        </button>
      </div>
    </div>
  </header>

  <!-- 主体工作区 (横屏双翼排布) -->
  <main class="flex-1 flex overflow-hidden p-2 gap-2">
    
    <!-- 【左侧翼】：待处理队列 (占据 60% 宽度) -->
    <section class="flex-[6] flex flex-col bg-slate-950 border border-slate-800 rounded-lg p-2 overflow-hidden">
      <div class="flex items-center justify-between mb-1.5 shrink-0">
        <div class="flex items-center space-x-1.5">
          <span class="flex h-1.5 w-1.5 rounded-full bg-slate-500"></span>
          <h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">待处理队列 (<span id="queueCount">0</span>)</h2>
          <span id="lockTip" class="hidden text-[9px] bg-amber-500/10 text-amber-400 border border-amber-500/20 px-1 rounded animate-pulse">🔒 锁定激活</span>
        </div>
        <span id="headerInfoText" class="text-[9px] text-slate-500 truncate max-w-[120px]"></span>
      </div>

      <!-- 队列容器 -->
      <div id="queueList" class="flex-1 flex flex-col justify-start space-y-1.5 bg-slate-900/50 p-1.5 rounded-lg border border-slate-800 overflow-y-auto">
        <div class="h-full flex flex-col items-center justify-center text-slate-500 p-4 text-center">
          <i data-lucide="upload" class="h-6 w-6 mb-1.5 text-indigo-500/60"></i>
          <p class="text-[11px] font-medium text-slate-400">请导入表格或进度文件</p>
        </div>
      </div>
    </section>

    <!-- 【右侧翼】：分窗接收区 (占据 40% 宽度) -->
    <section class="flex-[4] flex flex-col bg-slate-950 border border-slate-800 rounded-lg p-2 overflow-hidden">
      <div class="flex items-center justify-between mb-1.5 shrink-0">
        <div class="flex items-center space-x-1">
          <span class="flex h-1.5 w-1.5 rounded-full bg-indigo-500"></span>
          <h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">分流接收窗</h2>
        </div>
        <button id="addWindowBtn" class="px-1.5 py-0.5 text-[9px] bg-slate-800 text-indigo-400 rounded border border-slate-700">
          + 窗口
        </button>
      </div>

      <!-- 窗口横向/纵向混合排布容器 -->
      <div id="windowsContainer" class="flex-1 flex flex-col gap-1.5 overflow-y-auto pr-0.5">
        <!-- 动态渲染分窗 -->
      </div>
    </section>
  </main>

  <script>
    const PRESET_COLORS = [
      { border: 'border-pink-900/40', bg: 'bg-pink-950/20', text: 'text-pink-400', btn: 'bg-pink-600 text-white' }, 
      { border: 'border-blue-900/40', bg: 'bg-blue-950/20', text: 'text-blue-400', btn: 'bg-blue-600 text-white' },
      { border: 'border-emerald-900/40', bg: 'bg-emerald-950/20', text: 'text-emerald-400', btn: 'bg-emerald-600 text-white' },
      { border: 'border-purple-900/40', bg: 'bg-purple-950/20', text: 'text-purple-400', btn: 'bg-purple-600 text-white' },
      { border: 'border-orange-900/40', bg: 'bg-orange-950/20', text: 'text-orange-400', btn: 'bg-orange-600 text-white' }
    ];
    const GROUP_BG_COLORS = ['bg-rose-950/10 border-rose-900/30', 'bg-sky-950/10 border-sky-900/30', 'bg-emerald-950/10 border-emerald-900/30', 'bg-amber-950/10 border-amber-900/30', 'bg-violet-950/10 border-violet-900/30'];

    let windows = [
      { id: 'win-0', name: '水聊', color: PRESET_COLORS[0], items: [] },
      { id: 'win-1', name: 'HO1', color: PRESET_COLORS[1], items: [] },
      { id: 'win-2', name: 'HO2', color: PRESET_COLORS[2], items: [] },
      { id: 'win-3', name: 'HO3', color: PRESET_COLORS[3], items: [] }
    ];
    let queue = [];
    let isLoaded = false;
    let originalHeaders = new Set();
    let lockedWindowId = null;
    let qqToWindowMapping = {};
    let actionHistory = [];
    let groupColorMapping = {};

    function extractFields(row) {
      return {
        displayTime: row['时间'] || '',
        displaySender: row['发送者'] || '未知发送者',
        displayContent: row['消息内容'] || '（无内容）',
        rawTimeValue: row['时间'] ? new Date(row['时间']).getTime() : 0
      };
    }

    function getRowQQ(row) {
      return row['发送者QQ号'] || row['发送者QQ'] || row['QQ'] || row['发送者id'] || row['发送者ID'] || '无QQ';
    }

    function formatOnlyTime(isoString) {
      if (!isoString) return '';
      return isoString.includes('T') ? isoString.split('T')[1].split('.')[0] : String(isoString);
    }

    function getRecommendedWindow() {
      if (queue.length === 0) return null;
      const qq = getRowQQ(queue[0]);
      const recommendedWinId = qqToWindowMapping[qq];
      return recommendedWinId ? windows.find(w => w.id === recommendedWinId) || null : null;
    }

    function getGroupColorClass(sourceName) {
      if (!groupColorMapping[sourceName]) {
        const assignedIndex = Object.keys(groupColorMapping).length % GROUP_BG_COLORS.length;
        groupColorMapping[sourceName] = GROUP_BG_COLORS[assignedIndex];
      }
      return groupColorMapping[sourceName];
    }

    function renderAll() {
      renderWindows();
      renderQueue();
      updateUndoButtonState();
      lucide.createIcons();
    }

    function renderWindows() {
      const container = document.getElementById('windowsContainer');
      container.innerHTML = '';

      windows.forEach((win, index) => {
        const winEl = document.createElement('div');
        const isLocked = lockedWindowId === win.id;
        winEl.className = `flex items-center justify-between p-2 rounded-lg border transition-all ${isLocked ? 'border-indigo-500 bg-indigo-950/20' : `${win.color.border} ${win.color.bg}`}`;
        
        winEl.innerHTML = `
          <div class="flex items-center space-x-1.5 min-w-0">
            <input type="checkbox" ${isLocked ? 'checked' : ''} onchange="toggleLockWindow('${win.id}', this.checked)" class="h-4 w-4 text-indigo-600 border-slate-700 rounded bg-slate-800" />
            <div class="min-w-0">
              <div class="text-[11px] font-bold text-slate-200 truncate">${win.name}</div>
              <div class="text-[9px] text-slate-500">已收集 <span class="font-bold ${win.color.text}">${win.items.length}</span> 行</div>
            </div>
          </div>
          <div class="flex items-center space-x-1">
            <button onclick="exportWindow('${win.id}')" class="p-1 bg-slate-800 hover:bg-slate-700 text-slate-400 rounded"><i data-lucide="download" class="h-3.5 w-3.5"></i></button>
            <button onclick="removeWindow('${win.id}')" class="p-1 bg-slate-800 hover:bg-slate-700 text-slate-400 rounded"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
          </div>
        `;
        container.appendChild(winEl);
      });
    }

    window.toggleLockWindow = function(winId, checked) {
      lockedWindowId = checked ? winId : null;
      document.getElementById('lockTip').className = lockedWindowId ? 'text-[9px] bg-amber-500/10 text-amber-400 border border-amber-500/20 px-1 rounded animate-pulse' : 'hidden';
      renderAll();
    };

    function renderQueue() {
      document.getElementById('queueCount').innerText = queue.length;
      const listContainer = document.getElementById('queueList');

      if (!isLoaded) {
        listContainer.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-500 p-4 text-center"><i data-lucide="upload" class="h-6 w-6 mb-1.5 text-indigo-500/60"></i><p class="text-[11px] font-medium text-slate-400">请导入表格或进度文件</p></div>`;
        return;
      }

      if (queue.length === 0) {
        listContainer.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-500 p-4 text-center"><i data-lucide="check-circle-2" class="h-6 w-6 mb-1.5 text-emerald-500"></i><p class="text-[11px] text-emerald-400 font-bold">分拣完毕！</p></div>`;
        return;
      }

      const recommendedWin = getRecommendedWindow();
      const queueHtmlArr = [];

      queue.forEach((item, i) => {
        const isFirst = i === 0;
        const info = extractFields(item);
        const sourceLabel = item._来源 || '未知';
        const groupColorClass = getGroupColorClass(sourceLabel);

        let rowButtonsHtml = '';
        windows.forEach((win) => {
          const isRec = isFirst && recommendedWin && recommendedWin.id === win.id;
          rowButtonsHtml += `
            <button onclick="sortItemDirectly(event, ${i}, '${win.id}')" class="px-2 py-1 text-[10px] font-bold rounded border ${isRec ? 'bg-indigo-600 border-indigo-500 text-white animate-pulse' : 'bg-slate-800 hover:bg-slate-700 border-slate-700 text-slate-300'}">
              ${win.name}
            </button>
          `;
        });

        queueHtmlArr.push(`
          <div onclick="handleQueueRowClick(${i})" class="flex-none flex flex-col p-2 rounded-lg border border-slate-800 gap-1 bg-slate-900/80 ${groupColorClass}">
            <div class="flex items-center justify-between w-full">
              <div class="flex items-center space-x-1.5 min-w-0">
                <span class="w-4 h-4 rounded-full flex items-center justify-center text-[9px] font-bold bg-slate-800 text-slate-400">${i + 1}</span>
                <span class="text-[8px] font-bold text-indigo-400 bg-indigo-950/40 px-1 rounded border border-indigo-900/30">${sourceLabel}</span>
                <span class="text-[10px] font-bold text-slate-200 truncate max-w-[80px]">${info.displaySender}</span>
              </div>
              <div class="flex items-center space-x-1 shrink-0">${rowButtonsHtml}</div>
            </div>
            <div class="w-full pl-5 flex justify-between items-end gap-2">
              <p class="text-[11px] text-slate-300 leading-relaxed break-all select-text flex-1">${info.displayContent}</p>
              <button onclick="deleteSingleQueueItem(event, ${i})" class="p-1 bg-slate-800 text-slate-500 hover:text-rose-400 rounded border border-slate-700"><i data-lucide="trash-2" class="h-3 w-3"></i></button>
            </div>
          </div>
        `);
      });

      listContainer.innerHTML = queueHtmlArr.join('');
    }

    window.sortItemDirectly = function(e, itemIndex, windowId) {
      e.stopPropagation();
      if (itemIndex < queue.length) {
        const item = queue.splice(itemIndex, 1)[0];
        const win = windows.find(w => w.id === windowId);
        if (win) {
          win.items.push(item);
          pushAction({ type: 'click_sort', windowId: windowId, item: item, originalIdx: itemIndex });
          qqToWindowMapping[getRowQQ(item)] = windowId;
        }
        renderAll();
      }
    };

    window.deleteSingleQueueItem = function(e, index) {
      e.stopPropagation();
      if (index < queue.length) {
        const [deletedItem] = queue.splice(index, 1);
        pushAction({ type: 'delete_single', item: deletedItem, originalIdx: index });
        renderAll();
      }
    };

    window.handleQueueRowClick = function(itemIndex) {
      if (!lockedWindowId) return;
      if (itemIndex < queue.length) {
        const item = queue.splice(itemIndex, 1)[0];
        const win = windows.find(w => w.id === lockedWindowId);
        if (win) {
          win.items.push(item);
          pushAction({ type: 'click_sort', windowId: lockedWindowId, item: item, originalIdx: itemIndex });
          qqToWindowMapping[getRowQQ(item)] = lockedWindowId;
        }
        renderAll();
      }
    };

    function pushAction(action) { actionHistory.push(action); updateUndoButtonState(); }
    function updateUndoButtonState() {
      const btn = document.getElementById('undoBtn');
      if (btn) btn.disabled = actionHistory.length === 0;
    }

    window.triggerUndo = function() {
      if (actionHistory.length === 0) return;
      const act = actionHistory.pop();
      if (act.type === 'click_sort') {
        const win = windows.find(w => w.id === act.windowId);
        if (win && win.items.length > 0) queue.splice(act.originalIdx, 0, win.items.pop());
      } else if (act.type === 'delete_single') {
        queue.splice(act.originalIdx, 0, act.item);
      }
      renderAll();
    };

    document.getElementById('undoBtn').onclick = () => triggerUndo();
    function removeWindow(id) {
      const win = windows.find(w => w.id === id);
      if (win && win.items.length > 0) { queue = [...queue, ...win.items].sort((a, b) => extractFields(a).rawTimeValue - extractFields(b).rawTimeValue); }
      windows = windows.filter(w => w.id !== id);
      renderAll();
    }

    document.getElementById('addWindowBtn').onclick = () => {
      if (windows.length >= 8) return alert('最多支持 8 个分窗');
      windows.push({ id: `win-${windows.length}`, name: `新窗 ${windows.length}`, color: PRESET_COLORS[windows.length % PRESET_COLORS.length], items: [] });
      renderAll();
    };

    window.exportWindow = function(windowId) {
      const win = windows.find(w => w.id === windowId);
      if (!win || win.items.length === 0) return alert('暂无数据');
      const headers = Array.from(originalHeaders);
      const csvContent = [headers, ...win.items.map(item => headers.map(h => { const val = String(item[h] !== undefined ? item[h] : ''); return val.includes(',') ? `"${val}"` : val; }))].map(e => e.join(",")).join("\n");
      const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob); link.download = `${win.name}.csv`;
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    };

    document.getElementById('saveProgressBtn').onclick = () => {
      if (!isLoaded) return alert('暂无数据');
      try {
        const wb = XLSX.utils.book_new();
        const headers = Array.from(originalHeaders);
        const formatData = (items) => [headers, ...items.map(item => headers.map(h => item[h] !== undefined ? item[h] : ''))];
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(formatData(queue)), "待处理队列");
        windows.forEach(win => {
          const safeSheetName = win.name.replace(/[\\\?\*\/\[\]]/g, '').substring(0, 30) || `分窗_${win.id}`;
          XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(formatData(win.items)), safeSheetName);
        });
        XLSX.writeFile(wb, `跑团进度_手机备份.xlsx`);
      } catch (err) { alert(`保存失败: ${err.message}`); }
    };

    function readFileAsync(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try { resolve({ workbook: XLSX.read(new Uint8Array(e.target.result), { type: 'array' }), filename: file.name }); } catch (err) { reject(err); }
        };
        reader.readAsArrayBuffer(file);
      });
    }

    async function processFiles(files) {
      if (files.length === 0) return;
      try {
        const results = await Promise.all(Array.from(files).map(file => readFileAsync(file)));
        if (results.length === 1 && results[0].workbook.SheetNames.includes("待处理队列")) {
          const wb = results[0].workbook;
          queue = XLSX.utils.sheet_to_json(wb.Sheets["待处理队列"], { defval: "" });
          queue.forEach((row, idx) => { row.id = `row-imported-q-${idx}-${Date.now()}`; Object.keys(row).forEach(h => { if (h !== 'id' && h !== '_来源') originalHeaders.add(h); }); });
          windows = []; let winIdx = 0;
          wb.SheetNames.forEach(sheetName => {
            if (sheetName !== "待处理队列") {
              const items = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: "" });
              items.forEach((row, idx) => { row.id = `row-imported-w-${winIdx}-${idx}-${Date.now()}`; });
              windows.push({ id: `win-${winIdx}`, name: sheetName, color: PRESET_COLORS[winIdx % PRESET_COLORS.length], items: items });
              winIdx++;
            }
          });
          isLoaded = true;
          document.getElementById('actionButtons').classList.add('hidden');
          document.getElementById('activeControls').classList.remove('hidden');
          renderAll(); return;
        }

        const newRows = [];
        results.forEach((res, fileIdx) => {
          const groupMark = extractGroupName(res.filename);
          const data = XLSX.utils.sheet_to_json(res.workbook.Sheets[res.workbook.SheetNames[0]], { defval: "" });
          if (data.length > 0) {
            Object.keys(data[0]).forEach(h => { if (h !== 'id' && h !== '_来源') originalHeaders.add(h); });
            originalHeaders.add('_来源');
            data.forEach((row, idx) => { row.id = `row-${Date.now()}-${fileIdx}-${idx}`; row._来源 = groupMark; newRows.push(row); });
          }
        });
        queue = [...queue, ...newRows].sort((a, b) => extractFields(a).rawTimeValue - extractFields(b).rawTimeValue);
        isLoaded = true;
        document.getElementById('actionButtons').classList.add('hidden');
        document.getElementById('activeControls').classList.remove('hidden');
        document.getElementById('headerInfoText').innerText = `已导入 ${queue.length} 行`;
        renderAll();
      } catch (error) { alert('出错: ' + error.message); }
    }

    const fileInput = document.getElementById('fileInput');
    document.getElementById('uploadBtn').onclick = () => fileInput.click();
    fileInput.onchange = (e) => { processFiles(e.target.files); fileInput.value = ''; };

    document.getElementById('resetBtn').onclick = () => {
      queue = []; isLoaded = false; originalHeaders = new Set(); lockedWindowId = null; groupColorMapping = {};
      windows = [
        { id: 'win-0', name: '水聊', color: PRESET_COLORS[0], items: [] },
        { id: 'win-1', name: 'HO1', color: PRESET_COLORS[1], items: [] },
        { id: 'win-2', name: 'HO2', color: PRESET_COLORS[2], items: [] },
        { id: 'win-3', name: 'HO3', color: PRESET_COLORS[3], items: [] }
      ];
      fileInput.value = '';
      document.getElementById('actionButtons').classList.remove('hidden');
      document.getElementById('activeControls').classList.add('hidden');
      document.getElementById('headerInfoText').innerText = '';
      renderAll();
    };

    renderAll();
  </script>
</body>
</html>
